<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตลาดเซฟวัน โก</title>
<!-- แนวคิดใหม่ B · แกลเลอรี (29 ต.ค. 69) — ดีไซน์ใหม่ทั้งหน้า แบบนิตยสาร/แกลเลอรี พื้นกระดาษงาช้าง
     เปิดมา = หัวเรื่องใหญ่ + ภาพจริงเผยตัว + ป้าย "ตอนนี้ตลาดเปิดอยู่ไหม" → เลื่อนแนวนอนไล่สาขา → ภาพบรรยากาศ → มาเดิน · ราคาแบบเมนู · เช่าลาน · ผัง 3D · ติดต่อ
     ข้อมูลทั้งหมดอ่านจาก content/ ชุดเดียวกับหน้าแรก (cms.js) · หัวเรื่องสั้นๆ เป็นข้อความตัวอย่าง รอเจ้าของแก้ -->
<link href="https://fonts.googleapis.com/css2?family=Taviraj:ital,wght@0,200;0,300;0,400;1,300&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe6;--paper2:#ebe4d6;--card:#faf7f1;--ink:#15122b;--muted:#6d6779;--line:rgba(21,18,43,.13);--line2:rgba(21,18,43,.28);
  --go:#2f6b12;--go-hi:#84e62d;
  --serif:"Taviraj",serif;--sans:"Sarabun",sans-serif;--num:"Taviraj",serif;   /* ตัวเลขใช้ Taviraj: Bodoni เลข 4 เส้นบางจนอ่านเป็น 1 (044 → 011) */
  --ease:cubic-bezier(.22,.7,.18,1)}
*{box-sizing:border-box;margin:0}
html{overflow-x:clip;scroll-behavior:smooth}
body{overflow-x:clip;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
b,strong{font-weight:500}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
.w{display:inline-block;max-width:100%}
.wrap{max-width:1280px;margin:0 auto;padding:0 48px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.eyebrow b{font-family:var(--num);font-weight:400;font-size:15px;color:var(--ink)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line);max-width:120px}
.h2{font-family:var(--serif);font-weight:200;font-size:clamp(38px,5.2vw,72px);line-height:1.12;letter-spacing:-.01em;margin-top:20px}
.h2 em{font-style:italic;font-weight:300}
.lead{font-size:18px;color:var(--muted);max-width:52ch;margin-top:24px}
.brand{display:block;height:28px;--wm-ink:var(--ink);--wm-go:var(--go)}
.brand svg{height:100%;width:auto;display:block}
.link{display:inline-flex;align-items:center;gap:14px;font-size:15px;font-weight:500;text-decoration:none;padding:6px 0;border-bottom:1px solid var(--ink)}
.link .arrow{transition:transform .5s var(--ease)}
.link:hover .arrow{transform:translateX(6px)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:1px solid var(--ink);text-decoration:none;font-size:14px;font-weight:500;transition:background .4s var(--ease),color .4s}
.pill:hover,.pill.solid{background:var(--ink);color:var(--paper)}
.pill.solid:hover{background:transparent;color:var(--ink)}
.arrow{width:20px;height:10px;flex:none}

/* ── แถบบน ── */
.top{position:sticky;top:0;z-index:30;background:rgba(244,239,230,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px;height:74px}
.top nav{display:flex;justify-content:center;gap:36px;font-size:14px}
.top nav a{text-decoration:none;color:var(--muted);transition:color .3s}
.top nav a:hover{color:var(--ink)}
.top .pill{padding:9px 18px;font-size:13px}

/* ── หัวหน้า ── */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:stretch;padding-top:56px;min-height:calc(100vh - 74px)}
.hero .txt{display:flex;flex-direction:column;justify-content:space-between;padding-bottom:48px}
.hero h1{font-family:var(--serif);font-weight:200;font-size:clamp(56px,8.4vw,132px);line-height:1;letter-spacing:-.02em;margin-top:28px}
.hero h1 em{display:block;font-style:italic;font-weight:300;color:var(--go)}
.hero .lead{margin-top:30px}
.hero .acts{display:flex;flex-wrap:wrap;gap:28px;margin-top:36px}
.now{display:inline-flex;align-items:center;gap:12px;margin-top:44px;padding:12px 18px;border:1px solid var(--line2);font-size:14px;align-self:flex-start}
.now i{width:8px;height:8px;border-radius:50%;background:#b9b3c2}
.now.open i{background:var(--go-hi);box-shadow:0 0 0 4px rgba(132,230,45,.22);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(132,230,45,0)}}
.hero figure{position:relative;margin:0;overflow:hidden;min-height:540px;background:var(--paper2)}
.hero figure img{position:absolute;inset:0;width:100%;height:118%;object-fit:cover;will-change:transform}
.hero figure figcaption{position:absolute;left:0;bottom:0;padding:14px 18px;background:var(--paper);font-size:12px;color:var(--muted)}
.wipe{clip-path:inset(100% 0 0 0);transition:clip-path 1.6s var(--ease)}
.wipe.in{clip-path:inset(0 0 0 0)}

/* ── ตัวเลข ── */
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:110px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line)}
.fact{padding:30px 24px 26px 0}
.fact+.fact{padding-left:24px;border-left:1px solid var(--line)}
.fact b{display:block;font-family:var(--num);font-weight:200;font-size:clamp(40px,4.4vw,62px);line-height:1}
.fact small{display:block;font-size:14px;color:var(--muted);margin-top:12px}

/* ── สาขา: เลื่อนแนวนอน ── */
.hz{position:relative;margin-top:140px}
.hz .stick{position:sticky;top:74px;height:calc(100vh - 74px);overflow:hidden;display:flex;align-items:center}
.track{display:flex;gap:40px;padding:0 48px;will-change:transform}
.panel{flex:none;width:min(78vw,1080px);height:min(70vh,640px);display:grid;grid-template-columns:1.1fr 1fr;background:var(--card);border:1px solid var(--line)}
.panel.intro{width:min(46vw,560px);display:flex;flex-direction:column;justify-content:center;background:none;border:0;padding-right:20px}
.panel .ph{position:relative;overflow:hidden;background:var(--ink)}
.panel .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.8s var(--ease)}
.panel:hover .ph img{transform:scale(1)}
.panel .ph.none{display:grid;place-items:center;background:radial-gradient(120% 90% at 30% 20%,#2b2556 0,#15122b 65%)}
.panel .ph.none span{font-family:var(--num);font-size:clamp(90px,12vw,180px);color:rgba(244,239,230,.12);line-height:1}
.panel .bd{display:flex;flex-direction:column;padding:44px 44px 40px}
.panel .no{font-family:var(--num);font-size:16px;color:var(--muted)}
.panel h3{font-family:var(--serif);font-weight:200;font-size:clamp(44px,5vw,76px);line-height:1.05;margin-top:auto}
.panel .where{color:var(--muted);font-size:15px;margin-top:14px;max-width:40ch}
.panel dl{display:grid;grid-template-columns:1fr 1fr;margin-top:28px;border-top:1px solid var(--line2)}
.panel dl div{padding:14px 0;border-bottom:1px solid var(--line)}
.panel dt{font-size:13px;color:var(--muted)}
.panel dd{font-family:var(--num);font-size:24px}
.panel .acts{display:flex;flex-wrap:wrap;gap:24px;margin-top:28px}
.panel .acts .link{font-size:14px}
.progress{position:absolute;left:48px;right:48px;bottom:34px;height:1px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--ink)}

/* ── บรรยากาศ ── */
.gal{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:110px;gap:20px;margin-top:64px}
.gal figure{position:relative;margin:0;overflow:hidden;background:var(--paper2)}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.8s var(--ease)}
.gal figure:hover img{transform:scale(1.05)}
.gal figcaption{position:absolute;left:14px;bottom:12px;font-size:12px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.gal .a{grid-column:1/8;grid-row:span 5}.gal .b{grid-column:8/13;grid-row:span 3}.gal .c{grid-column:8/13;grid-row:span 2}
.gal .d{grid-column:1/5;grid-row:span 3}.gal .e{grid-column:5/13;grid-row:span 3}

/* ── มาเดิน / มาขาย ── */
.split{display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:start}
.rows{border-top:1px solid var(--line2)}
.rowl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .5s var(--ease)}
a.rowl:hover{padding-left:12px}
.rowl b{display:block;font-family:var(--serif);font-weight:300;font-size:24px;line-height:1.35}
.rowl small{display:block;color:var(--muted);font-size:14px}
.rowl.off{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:28px;margin-top:34px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 0;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;background:none;font-size:15px;color:var(--muted);cursor:pointer;transition:color .3s,border-color .3s}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
/* เมนูราคา: เส้นจุดไข่ปลาเชื่อมราคา */
.zone{padding:30px 0 6px;border-bottom:1px solid var(--line)}
.zone h4{display:flex;align-items:baseline;gap:14px;font-family:var(--serif);font-weight:300;font-size:30px;line-height:1.3}
.zone h4 small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.zone p{color:var(--muted);font-size:14px;margin-top:4px}
.price{display:flex;align-items:baseline;gap:10px;padding:10px 0;font-size:15px}
.price .dots{flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-5px)}
.price b{font-family:var(--num);font-weight:400;font-size:24px}
.price em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.price .now-t{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--go);margin-left:8px}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:80px;border-top:1px solid var(--line2)}
.steps li{counter-increment:s;padding-top:24px}
.steps li::before{content:counter(s,decimal-leading-zero);display:block;font-family:var(--num);font-size:46px;line-height:1;margin-bottom:18px}
.steps b{display:block;font-size:16px}
.steps li>span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.fine{font-size:13px;color:var(--muted);margin-top:16px}

/* ── เช่าลาน ── */
.event{display:grid;grid-template-columns:1.2fr 1fr;margin-top:160px;background:var(--ink);color:var(--paper)}
.event figure{margin:0;position:relative;overflow:hidden;min-height:620px}
.event figure img{position:absolute;inset:-8% 0;width:100%;height:116%;object-fit:cover;will-change:transform}
.event .bd{padding:72px 64px;display:flex;flex-direction:column;justify-content:center}
.event .eyebrow{color:rgba(244,239,230,.6)}.event .eyebrow b{color:var(--paper)}.event .eyebrow::after{background:rgba(244,239,230,.2)}
.event .lead{color:rgba(244,239,230,.7)}
.event .price .dots{border-color:rgba(244,239,230,.3)}
.event .fine{color:rgba(244,239,230,.55)}
.event .pill{border-color:var(--paper);color:var(--paper)}
.event .pill:hover{background:var(--paper);color:var(--ink)}

/* ── ผัง 3D ── */
.mapbox{position:relative;margin-top:56px;height:min(78vh,740px);overflow:hidden;background:#100d24;outline:1px solid var(--line2);outline-offset:8px}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbox .cover{position:absolute;inset:0;display:grid;place-items:center;width:100%;border:0;background:rgba(21,18,43,.45);cursor:pointer;transition:opacity .5s}
.mapbox .cover span{padding:14px 26px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:500}
.mapbox.live .cover{opacity:0;pointer-events:none}

/* ── ติดต่อ + ท้ายหน้า ── */
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:64px;border-top:1px solid var(--line2)}
.contact>div{padding:34px 32px 34px 0}
.contact>div+div{padding-left:32px;border-left:1px solid var(--line)}
.contact h4{font-family:var(--serif);font-weight:300;font-size:26px}
.contact .tel{display:block;font-family:var(--num);font-size:38px;line-height:1.2;text-decoration:none;margin-top:16px}
.contact p{color:var(--muted);font-size:14px;margin-top:4px}
.contact .ln{display:inline-block;margin-top:12px;margin-right:16px;font-size:14px;text-decoration:none;border-bottom:1px solid var(--line2)}
footer{margin-top:160px;background:var(--ink);color:rgba(244,239,230,.7);padding:80px 0 44px;font-size:14px}
footer .big{font-family:var(--serif);font-weight:200;font-size:clamp(40px,6vw,88px);line-height:1.05;color:var(--paper)}
footer .big em{font-style:italic;font-weight:300;color:var(--go-hi)}
footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:64px;padding-top:28px;border-top:1px solid rgba(244,239,230,.16)}
footer .brand{height:32px;--wm-ink:var(--paper);--wm-go:var(--go-hi)}
footer .fine{color:rgba(244,239,230,.45)}

.sec{padding-top:160px}
.rv{opacity:0;transform:translateY(32px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.12s}.d2{transition-delay:.24s}.d3{transition-delay:.36s}
@media (prefers-reduced-motion:reduce){ .rv,.wipe{opacity:1;transform:none;clip-path:none;transition:none} }

@media (max-width:960px){
  .wrap{padding:0 28px}
  .top nav{display:none}.top .wrap{grid-template-columns:auto 1fr auto}
  .hero{grid-template-columns:1fr;gap:36px;min-height:0}
  .hero figure{min-height:380px}
  .facts{grid-template-columns:1fr 1fr}
  .fact:nth-child(3){padding-left:0;border-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  /* สาขาบนจอแคบ: เรียงลงตามปกติ ไม่เลื่อนข้าง */
  .hz .stick{position:static;height:auto;display:block}
  .track{flex-direction:column;padding:0 28px;transform:none !important}
  .panel,.panel.intro{width:100%;height:auto;grid-template-columns:1fr}
  .panel .ph{height:300px}
  .progress{display:none}
  .gal{grid-auto-rows:80px;gap:12px}
  .split,.event{grid-template-columns:1fr;gap:56px}
  .event{gap:0}.event figure{min-height:340px}.event .bd{padding:48px 28px}
  .steps{grid-template-columns:1fr 1fr}
  .contact{grid-template-columns:1fr}
  .contact>div,.contact>div+div{padding:28px 0;border-left:0;border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .wrap,.track{padding:0 16px}
  .top .wrap{height:62px;gap:12px}.brand{height:22px}.top .pill{padding:8px 12px}
  .hz .stick{top:62px}
  .sec{padding-top:110px}.facts{margin-top:72px}.hz{margin-top:100px}
  .panel .bd{padding:28px 22px}
  .gal .a,.gal .b,.gal .c,.gal .d,.gal .e{grid-column:1/-1;grid-row:span 3}
  .steps{grid-template-columns:1fr;gap:0}
  .zone h4{font-size:24px}
  .event{margin-top:110px}
  footer{margin-top:110px}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="brand" data-wm href="#" aria-label="ตลาดเซฟวัน GO"></a>
  <nav><a href="#branches">สาขา</a><a href="#visit">มาเดินตลาด</a><a href="#sell">มาขายของ</a><a href="#map">ผังตลาด</a><a href="#contact">ติดต่อ</a></nav>
  <a class="pill" id="topBook" href="#sell">จองล็อก</a>
</div></header>

<main id="main"></main>
<footer id="foot"></footer>

<script src="content/cms.js?v=20261030a"></script>
<script>
const { esc, get, phr } = CMS;
const $ = id => document.getElementById(id);
const ARROW = '<svg class="arrow" viewBox="0 0 20 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5h19M15 1l4 4-4 4"/></svg>';
const digits = s => String(s || '').replace(/[^\d+]/g, '');
const lineUrl = id => 'https://line.me/R/ti/p/' + encodeURIComponent(String(id || '').trim());
const ext = h => /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : '';
const nums = s => String(s || '').match(/\d[\d,]*/g)?.map(n => +n.replace(/,/g, '')) || [];
let C, VB = 'sg';

// ป้าย "ตอนนี้": เทียบเวลาเครื่องกับเวลาเปิด "16:00–23:00"
function nowBadge(hours) {
  const [o, c] = hours.split('–').map(t => { const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); });
  const d = new Date(), n = d.getHours() * 60 + d.getMinutes(), open = n >= o && n < c;
  const left = m => m >= 60 ? `${Math.floor(m / 60)} ชม. ${m % 60 ? (m % 60) + ' นาที' : ''}` : `${m} นาที`;
  return { open, text: open ? `ตอนนี้ตลาดเปิดอยู่ · ปิด ${hours.split('–')[1]}` : `ตลาดเปิดอีก ${left(((o - n) + 1440) % 1440)} · ${hours}` };
}
const zonesOf = k => Object.entries(C[k].vendor.zones).filter(([, Z]) => Z.rows.some(r => nums(r.online).length));
const photosOf = k => (C[k].customer.photos || []).filter(([s]) => s);

function render() {
  const sg = C.sg, ko = C.korat, hours = sg.facts[0]?.[2] || '16:00–23:00';
  const heroPh = photosOf('korat')[0] || ['', ''];
  const nb = nowBadge(hours);
  const minSg = Math.min(...zonesOf('sg').flatMap(([, Z]) => Z.rows.flatMap(r => nums(r.online))));
  const panel = (k, i) => { const b = C[k], ph = photosOf(k)[0], map = get(C, `${k}.links.map`);
    return `<article class="panel"><div class="ph${ph ? '' : ' none'}">${ph ? `<img src="${esc(ph[0])}" alt="${esc(ph[1])}" loading="lazy">` : `<span>0${i + 1}</span>`}</div>
      <div class="bd"><span class="no">0${i + 1} / 0${C.branchKeys.length}</span><h3>${esc(b.name)}</h3><p class="where">${phr(b.where)}</p>
      <dl>${b.facts.map(f => `<div><dt>${esc(f[1])}</dt><dd>${esc(f[2])}</dd></div>`).join('')}</dl>
      <div class="acts">${map ? `<a class="link" href="${esc(map)}"${ext(map)}>นำทาง ${ARROW}</a>` : ''}<a class="link" href="tel:${digits(b.contact.phone)}">โทร ${esc(b.contact.phone)}</a></div></div></article>`; };
  // ภาพบรรยากาศ (โคราช) · คำบรรยายสั้นๆ
  const P = ko.photos, g = [[photosOf('korat')[1]?.[0], photosOf('korat')[1]?.[1]], [P.fountain?.[0], 'ลานน้ำพุม้า'], ['content/korat/img/food-stalls.jpg', 'สตรีทฟู้ด'], ['content/korat/img/goods-stalls.jpg', 'เปิดท้าย'], [P.event?.[1], 'ลานหน้าทาวเวอร์']].filter(([s]) => s);
  const ev = ko.vendor.event, evPh = ev.photos.find(([s]) => s)?.[0];

  $('main').innerHTML = `
  <div class="wrap">
    <section class="hero">
      <div class="txt"><div>
        <p class="eyebrow rv">${esc(C.gate.kicker)} · ${esc(hours)}</p>
        <h1 class="rv d1">ตลาดเย็น<em>เซฟวัน โก</em></h1>
        <p class="lead rv d2">ตลาดเย็นเปิดทุกวัน ${C.branchKeys.length} สาขา · ที่เดินเล่นหาของกินของครอบครัว และที่เริ่มต้นของผู้ค้า โดยไม่มีค่าเซ้ง</p>
        <div class="acts rv d3"><a class="link" href="#visit">${esc(C.gate.cus.title)} ${ARROW}</a><a class="link" href="#sell">${esc(C.gate.ven.title)} ${ARROW}</a></div></div>
        <p class="now rv d3${nb.open ? ' open' : ''}"><i></i>${esc(nb.text)} <small style="color:var(--muted)">(${esc(sg.name)})</small></p>
      </div>
      <figure class="wipe" id="heroFig"><img id="heroImg" src="${esc(heroPh[0])}" alt="${esc(heroPh[1])}"><figcaption>${esc(heroPh[1])}</figcaption></figure>
    </section>
    <div class="facts">
      <div class="fact rv"><b>0${C.branchKeys.length}</b><small>สาขา</small></div>
      <div class="fact rv d1"><b>${esc(hours.split('–')[0])}</b><small>เปิดทุกวัน · ถึง ${esc(hours.split('–')[1])}</small></div>
      <div class="fact rv d2"><b>${minSg}</b><small>บาท · ค่าล็อกเริ่มต้นต่อวัน (${esc(sg.name)})</small></div>
      <div class="fact rv d3"><b>0</b><small>บาท · ค่าเซ้ง ไม่มีล็อกประจำ</small></div>
    </div>
  </div>

  <section class="hz" id="branches"><div class="stick"><div class="track" id="track">
    <div class="panel intro"><p class="eyebrow"><b>01</b>สาขา</p><h2 class="h2">ตลาดของเรา<br><em>${C.branchKeys.length} แห่ง</em></h2><p class="lead">เลื่อนลงเพื่อดูทีละสาขา · ที่อยู่ เวลา และเบอร์โทร</p></div>
    ${C.branchKeys.map(panel).join('')}
  </div><div class="progress"><i id="prog"></i></div></div></section>

  <section class="sec"><div class="wrap">
    <p class="eyebrow rv"><b>02</b>บรรยากาศ</p><h2 class="h2 rv d1">เย็นนี้ <em>เจอกันที่ตลาด</em></h2>
    <div class="gal">${g.map(([s, c], i) => `<figure class="${'abcde'[i]} wipe"><img src="${esc(s)}" alt="${esc(c)}" loading="lazy"><figcaption>${esc(c)}</figcaption></figure>`).join('')}</div>
    <p class="fine">ภาพจากสาขา${esc(ko.name)}</p>
  </div></section>

  <section class="sec" id="visit"><div class="wrap split">
    <div><p class="eyebrow rv"><b>03</b>${esc(C.gate.cus.title)}</p><h2 class="h2 rv d1">ทุกอย่างที่ต้องรู้<br><em>ก่อนออกจากบ้าน</em></h2><p class="lead rv d2">${phr(sg.customer.sub)}</p></div>
    <div><div class="tabs" id="cTabs">${C.branchKeys.map(k => `<button data-b="${k}">${esc(C[k].name)}</button>`).join('')}</div><div class="rows rv" id="cRows" style="border-top:0"></div></div>
  </div></section>

  <section class="sec" id="sell"><div class="wrap">
    <div class="split">
      <div><p class="eyebrow rv"><b>04</b>${esc(C.gate.ven.title)}</p><h2 class="h2 rv d1">ราคาชัด<br><em>จองรายวัน</em></h2><p class="lead rv d2" id="vSub"></p>
        <div class="cta rv d3" id="vCta"></div></div>
      <div><div class="tabs" id="vTabs">${C.branchKeys.map(k => `<button data-b="${k}">${esc(C[k].name)}</button>`).join('')}</div><div id="vMenu"></div><p class="fine" id="vNote"></p></div>
    </div>
    <ol class="steps" id="vSteps"></ol>
  </div></section>

  ${evPh ? `<section class="event"><figure><img id="evImg" src="${esc(evPh)}" alt="${esc(ev.title)}" loading="lazy"></figure><div class="bd">
    <p class="eyebrow rv"><b>05</b>${esc(ev.title)} · สาขา${esc(ko.name)}</p><h2 class="h2 rv d1" style="font-size:clamp(34px,4vw,56px)">พื้นที่สำหรับ<br><em>งานของคุณ</em></h2>
    <p class="lead rv d2">${phr(ev.sub)}</p>
    <div class="rv d2" style="margin-top:28px">${ev.rows.map(([a, p]) => `<div class="price"><span>${esc(a)}</span><span class="dots"></span><b>${esc(p)}</b><em>บาท</em></div>`).join('')}</div>
    <p class="fine">${phr(ev.areas)} · ${phr(ev.note)}</p>
    <div class="cta"><a class="pill" href="tel:${digits(ev.tel)}">สอบถาม ${esc(ev.tel)}</a></div></div></section>` : ''}

  <section class="sec" id="map"><div class="wrap">
    <p class="eyebrow rv"><b>06</b>ผังตลาด</p><h2 class="h2 rv d1">เดินดูตลาด <em>ก่อนมาจริง</em></h2>
    <p class="lead rv d2">ผัง 3 มิติของแต่ละสาขา แตะหมุดเพื่อดูโซน ที่จอดรถ และจุดบริการ</p>
    <div class="mapbox rv d2" id="mapbox"><button class="cover" id="mapCover"><span>แตะเพื่อเปิดผัง 3D</span></button></div>
  </div></section>

  <section class="sec" id="contact"><div class="wrap">
    <p class="eyebrow rv"><b>07</b>ติดต่อ</p><h2 class="h2 rv d1">ยินดีให้ <em>ข้อมูลทุกวัน</em></h2>
    <div class="contact rv d2">${C.branchKeys.map(k => { const c = C[k].contact, same = c.lineCustomer === c.lineVendor; return `<div><h4>สาขา${esc(C[k].name)}</h4><a class="tel" href="tel:${digits(c.phone)}">${esc(c.phone)}</a><p>โทร ${esc(c.phoneHours)}</p>
      <a class="ln" href="${esc(lineUrl(c.lineVendor))}" target="_blank" rel="noopener">${same ? 'LINE' : 'ผู้ค้า'} ${esc(c.lineVendor)}</a>${same ? '' : `<a class="ln" href="${esc(lineUrl(c.lineCustomer))}" target="_blank" rel="noopener">ลูกค้า ${esc(c.lineCustomer)}</a>`}</div>`; }).join('')}
      <div><h4>${esc(C.contact.company)}</h4><p>${phr(C.contact.address)}</p></div></div>
  </div></section>`;

  $('foot').innerHTML = `<div class="wrap"><p class="big">เย็นนี้<br><em>ไปตลาดกัน</em></p>
    <div class="row"><span class="brand" data-wm></span><div><p>${esc(C.contact.company)}</p><p>${phr(C.contact.address)}</p></div></div>
    <p class="fine" style="margin-top:20px">${phr(C.contact.footnote)}</p></div>`;

  $('cTabs').onclick = e => { const b = e.target.closest('button'); if (b) visit(b.dataset.b); };
  $('vTabs').onclick = e => { const b = e.target.closest('button'); if (b) { VB = b.dataset.b; vendor(); } };
  visit('sg'); vendor();
  $('mapCover').onclick = () => {
    const f = document.createElement('iframe'); f.title = 'ผังตลาด 3D'; f.src = 'branch-flip.html?v=20261031b';
    f.onload = () => { try { f.contentWindow.postMessage({ pinGroup: null, content: C }, location.origin); } catch {} };
    $('mapbox').prepend(f); $('mapbox').classList.add('live');
  };
  fillWordmarks(); reveal(); onScroll();
}
// มาเดินตลาด: ลิงก์ด่วนของสาขา (ชี้ไปค่าใน links/contact ของสาขานั้น)
function visit(k) {
  document.querySelectorAll('#cTabs button').forEach(x => x.classList.toggle('on', x.dataset.b === k));
  const val = (kind, key) => get(C, `${k}.${kind}.${key}`) || get(C, `${kind}.${key}`) || '';
  const href = q => q.line ? lineUrl(val('contact', q.line)) : q.link ? val('links', q.link) : q.href === '#map' ? '#map' : q.href || '';
  $('cRows').innerHTML = C[k].customer.quick.map(q => { const h = href(q);
    return `<a class="rowl${h ? '' : ' off'}" href="${esc(h || '#')}"${ext(h)}><span><b>${esc(q.title)}</b><small>${phr(q.sub)}${h ? '' : ' · รอลิงก์'}</small></span>${ARROW}</a>`; }).join('');
}
function vendor() {
  const b = C[VB], V = b.vendor, now = CMS.seasonNow(V.seasons), dow = CMS.dowNow();
  document.querySelectorAll('#vTabs button').forEach(x => x.classList.toggle('on', x.dataset.b === VB));
  $('vSub').innerHTML = phr(V.sub);
  $('vMenu').innerHTML = zonesOf(VB).map(([z, Z]) => `<div class="zone"><h4>${esc(Z.name)} <small>บาท / ล็อก / วัน · จองออนไลน์</small></h4><p>${phr(C.vendor.rules[z]?.sub || '')} · ${phr(Z.facts.find(f => f[0] === 'size')?.[2] || '')}</p>
    ${Z.rows.filter(r => r.online).map(r => { const on = (!r.season || r.season === now) && r.dow === dow;
      return `<div class="price"><span>${r.season ? esc(get(V.seasons, r.season + '.label') || '') + ' · ' : ''}${esc(r.days)}${on ? '<span class="now-t">วันนี้</span>' : ''}</span><span class="dots"></span><b>${esc(r.online)}</b><em>หน้างาน ${esc(r.walkin)}</em></div>`; }).join('')}</div>`).join('');
  $('vNote').innerHTML = phr(V.scope);
  $('vSteps').innerHTML = V.steps.items.filter(([t]) => t).map(([t, s]) => `<li class="rv in"><b>${phr(t)}</b><span>${phr(s)}</span></li>`).join('');
  const book = get(C, `${VB}.links.booking`);
  $('vCta').innerHTML = (book ? `<a class="pill solid" href="${esc(book)}" target="_blank" rel="noopener">จองล็อก ${ARROW}</a>` : '')
    + `<a class="pill" href="${esc(lineUrl(b.contact.lineVendor))}" target="_blank" rel="noopener">LINE ${esc(b.contact.lineVendor)}</a><a class="pill" href="home.html">ระเบียบเต็ม</a>`;
  $('topBook').href = book || '#sell'; if (book) { $('topBook').target = '_blank'; $('topBook').rel = 'noopener'; }
}
let WM = null;
async function fillWordmarks() {
  try { WM = WM || await (await fetch('img/wordmark.svg')).text(); } catch { return; }
  document.querySelectorAll('[data-wm]').forEach(el => { if (!el.firstChild) el.innerHTML = WM; });
}
function reveal() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
  document.querySelectorAll('.rv:not(.in),.wipe:not(.in)').forEach(el => io.observe(el));
}
// เลื่อนจอ: สาขาเลื่อนแนวนอน (จอกว้าง) · ภาพหัวหน้า/ลานจัดงาน เลื่อนช้ากว่าหน้า
function sizeHz() {
  const hz = $('branches'), tr = $('track'); if (!hz) return;
  if (innerWidth <= 960) { hz.style.height = ''; return; }
  hz.style.height = (tr.scrollWidth - innerWidth + innerHeight) + 'px';
}
function onScroll() {
  const hz = $('branches'), tr = $('track');
  if (hz && innerWidth > 960) {
    const r = hz.getBoundingClientRect(), span = hz.offsetHeight - (innerHeight - 74), p = Math.min(1, Math.max(0, (74 - r.top) / Math.max(1, span)));   // 74 = ความสูงแถบบน (จุดที่ค้างจอ)
    tr.style.transform = `translateX(${-p * Math.max(0, tr.scrollWidth - innerWidth)}px)`;
    $('prog').style.width = (p * 100) + '%';
  }
  [['heroImg', .1], ['evImg', .08]].forEach(([id, k]) => { const im = $(id); if (!im) return;
    const r = im.parentElement.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    im.style.transform = `translateY(${-((r.top + r.height / 2) - innerHeight / 2) * k - (id === 'heroImg' ? r.height * .09 : 0)}px)`; });
}
let tick = false;
addEventListener('scroll', () => { if (tick) return; tick = true; requestAnimationFrame(() => { onScroll(); tick = false; }); }, { passive: true });
addEventListener('resize', () => { sizeHz(); onScroll(); });
CMS.load().then(c => { C = c; render(); sizeHz(); onScroll(); document.querySelectorAll('#track img').forEach(im => im.addEventListener('load', sizeHz)); })
  .catch(e => { $('main').innerHTML = `<p class="wrap sec">โหลดข้อมูลไม่ได้: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
