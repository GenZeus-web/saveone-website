<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตลาดเซฟวัน โก</title>
<!-- แนวคิดใหม่ A · สนธยา (29 ต.ค. 69) — ดีไซน์ใหม่ทั้งหน้า ไม่ใช่ปรับหน้าตาแบบ D
     เปิดมา = เลื่อนแล้วฟ้าเปลี่ยนจาก 16:00 → 23:00 ไฟร้านติดทีละดวง → ภาพจริงตลาดยามค่ำ → เรื่องตลาด · สาขา · มาเดิน/มาขาย · ราคา · เช่าลาน · ผัง 3D · ติดต่อ
     ข้อมูลทั้งหมดอ่านจาก content/ ชุดเดียวกับหน้าแรก (cms.js) · ข้อความโปรย (หัวเรื่องสั้นๆ) เป็นตัวอย่าง รอเจ้าของแก้ -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@200;300;400;500&family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--night:#0b0a14;--night2:#12111f;--ink:#f3ede2;--muted:#a39db0;--line:rgba(243,237,226,.12);--line2:rgba(243,237,226,.24);
  --go:#84e62d;--lamp:#ffd58a;
  --serif:"Noto Serif Thai",serif;--sans:"IBM Plex Sans Thai Looped",sans-serif;--num:"Cormorant Garamond","Noto Serif Thai",serif;
  --ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}
html{overflow-x:clip;scroll-behavior:smooth}   /* clip ไม่ใช่ hidden: hidden ทำให้ฉากเปิดไม่ค้างจอ (sticky) */
body{overflow-x:clip;background:var(--night);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
b,strong{font-weight:500}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
.w{display:inline-block;max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.k{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.k i{display:inline-block;width:28px;height:1px;background:currentColor;vertical-align:middle;margin-right:12px;opacity:.6}
.brand{display:block;height:28px;--wm-ink:var(--ink);--wm-go:var(--go)}
.brand svg{height:100%;width:auto;display:block}
.btn{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border:1px solid var(--line2);text-decoration:none;font-size:14px;letter-spacing:.03em;transition:background .4s var(--ease),color .4s,border-color .4s}
.btn:hover{background:var(--ink);color:var(--night);border-color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--night);border-color:var(--ink)}
.btn.solid:hover{background:transparent;color:var(--ink)}
.btn.off{opacity:.4;pointer-events:none}
.arrow{width:18px;height:10px;flex:none}

/* ── แถบบน ── */
.top{position:fixed;inset:0 0 auto;z-index:30;transition:background .5s,border-color .5s;border-bottom:1px solid transparent}
.top.solid{background:rgba(11,10,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:20px}
.top nav{display:flex;gap:34px;font-size:13px;letter-spacing:.04em}
.top nav a{text-decoration:none;color:rgba(243,237,226,.75);transition:color .3s}
.top nav a:hover{color:var(--ink)}

/* ── ฉากเปิด: ฟ้า 16:00 → 23:00 ── */
.dusk{position:relative;height:340vh}
.dusk .pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.sky{position:absolute;inset:0}
.sun{position:absolute;left:68%;width:min(22vw,220px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff3d6 0,#ffd08a 45%,rgba(255,170,90,0) 70%);filter:blur(2px);transform:translate(-50%,-50%)}
.stars{position:absolute;inset:0 0 40% 0;background-image:radial-gradient(1px 1px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 26%,#fff,transparent),radial-gradient(1px 1px at 61% 12%,#fff,transparent),radial-gradient(1px 1px at 79% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 9%,#fff,transparent),radial-gradient(1px 1px at 6% 38%,#fff,transparent),radial-gradient(1px 1px at 35% 40%,#fff,transparent),radial-gradient(1px 1px at 70% 44%,#fff,transparent);opacity:0}
.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(46vh,420px)}
.photo{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transform:scale(1.12)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,20,.75),rgba(11,10,20,.1) 60%),linear-gradient(180deg,rgba(11,10,20,.4),transparent 40%,rgba(11,10,20,.85))}
.copy{position:absolute;inset:0;display:grid;align-content:start;padding-top:clamp(110px,17vh,190px) !important;justify-items:start;padding:0 max(40px,calc((100vw - 1200px)/2 + 40px));pointer-events:none}
.copy .k{color:rgba(243,237,226,.8)}
.copy h1{font-family:var(--serif);font-weight:200;font-size:clamp(44px,8vw,112px);line-height:1.08;letter-spacing:-.01em;margin:18px 0 0;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.clock{display:flex;align-items:baseline;gap:18px;margin-top:34px}
.clock b{font-family:var(--num);font-weight:300;font-size:clamp(46px,6vw,76px);line-height:1;letter-spacing:.02em}
.clock span{font-size:15px;color:rgba(243,237,226,.85);max-width:24ch;transition:opacity .4s}
.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:12px;letter-spacing:.1em;color:rgba(243,237,226,.7);display:grid;justify-items:center;gap:8px;transition:opacity .4s}
.hint::after{content:"";width:1px;height:38px;background:linear-gradient(var(--ink),transparent);animation:drip 2.2s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.bulb{fill:#3a3346;transition:fill .5s}
.bulb.on{fill:var(--lamp);filter:url(#glow)}
.cap{position:absolute;right:max(40px,calc((100vw - 1200px)/2 + 40px));bottom:30px;font-size:12px;color:rgba(243,237,226,.6);opacity:0}

/* ── ส่วนเนื้อหา ── */
.sec{padding:150px 0 0}
.h2{font-family:var(--serif);font-weight:200;font-size:clamp(34px,4.6vw,60px);line-height:1.2;letter-spacing:-.005em;margin-top:18px}
.lead{font-size:17px;color:var(--muted);max-width:56ch;margin-top:22px}
/* เรื่องตลาด: ประโยคใหญ่ + ตัวเลข */
.intro{display:grid;grid-template-columns:1.25fr 1fr;gap:80px;align-items:end}
.intro p.big{font-family:var(--serif);font-weight:200;font-size:clamp(26px,3vw,38px);line-height:1.5}
.intro p.big em{font-style:normal;color:var(--lamp)}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2)}
.stat{padding:26px 0 22px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){padding-right:20px;border-right:1px solid var(--line)}
.stat:nth-child(even){padding-left:24px}
.stat b{display:block;font-family:var(--num);font-weight:300;font-size:50px;line-height:1}
.stat small{display:block;font-size:13px;color:var(--muted);margin-top:8px}
/* สาขา */
.branches{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:64px}
.br{position:relative;display:flex;flex-direction:column;min-height:620px;overflow:hidden;border:1px solid var(--line);background:var(--night2)}
.br .ph{position:absolute;inset:0;background:center/cover no-repeat;transform:scale(1.04);transition:transform 1.6s var(--ease)}
.br:hover .ph{transform:scale(1.1)}
.br .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,20,.1) 20%,rgba(11,10,20,.92) 78%)}
.br .ph.none{background:radial-gradient(120% 80% at 70% 10%,#2a2450 0,#12111f 60%)}
.br .mono{position:absolute;top:28px;right:30px;font-family:var(--num);font-weight:300;font-size:120px;line-height:1;color:rgba(243,237,226,.07)}
.br .in{position:relative;margin-top:auto;padding:36px}
.br .code{font-size:13px;letter-spacing:.04em;color:var(--go)}
.br h3{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1.2;margin:6px 0 8px}
.br .where{font-size:14px;color:rgba(243,237,226,.75);max-width:44ch}
.br dl{display:grid;grid-template-columns:repeat(2,1fr);margin-top:22px;border-top:1px solid var(--line2)}
.br dl div{padding:12px 0;border-bottom:1px solid var(--line)}
.br dt{font-size:12px;color:var(--muted)}
.br dd{font-family:var(--num);font-size:24px;font-weight:400;line-height:1.2}
.br .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.br .acts .btn{padding:10px 18px;font-size:13px;background:rgba(11,10,20,.35);backdrop-filter:blur(6px)}
/* มาเดิน / มาขาย */
.paths{display:grid;grid-template-columns:1fr 1fr;margin-top:64px;border-top:1px solid var(--line2)}
.path{position:relative;padding:48px 48px 44px 0;text-decoration:none;transition:background .5s var(--ease)}
.path+.path{padding-left:48px;border-left:1px solid var(--line)}
.path .no{font-family:var(--num);font-size:18px;color:var(--muted)}
.path h3{font-family:var(--serif);font-weight:200;font-size:clamp(36px,4vw,54px);line-height:1.2;margin:10px 0 18px}
.path ul{list-style:none;padding:0;color:var(--muted);font-size:15px}
.path li{padding:9px 0;border-top:1px solid var(--line)}
.path .go{display:inline-flex;align-items:center;gap:12px;margin-top:26px;font-size:14px;letter-spacing:.04em}
.path .go .arrow{transition:transform .5s var(--ease)}
.path:hover .go .arrow{transform:translateX(8px)}
/* ราคา (เมนูราคา) */
.vend{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:start}
.seg{display:inline-flex;border:1px solid var(--line2);margin-top:30px}
.seg button{padding:10px 22px;border:0;background:none;font-size:14px;color:var(--muted);cursor:pointer;transition:all .3s}
.seg button.on{background:var(--ink);color:var(--night)}
.menu{border-top:1px solid var(--line2)}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:26px 0;border-bottom:1px solid var(--line)}
.item h4{font-family:var(--serif);font-weight:300;font-size:28px;line-height:1.3}
.item .p{font-family:var(--num);font-size:36px;font-weight:300;line-height:1.1;text-align:right;white-space:nowrap}
.item .p small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.02em}
.item p{grid-column:1/-1;color:var(--muted);font-size:14px}
.steps{list-style:none;padding:0;counter-reset:s;margin-top:44px;display:grid;gap:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:56px 1fr;padding:16px 0;border-top:1px solid var(--line)}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--num);font-size:22px;color:var(--go)}
.steps b{display:block;font-weight:500}
.steps span{color:var(--muted);font-size:14px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.fine{font-size:12px;color:var(--muted);margin-top:16px}
/* เช่าลาน */
.event{position:relative;margin-top:150px;min-height:88vh;display:grid;align-items:end;overflow:hidden}
.event .ph{position:absolute;inset:-10% 0;background:center/cover no-repeat;will-change:transform}
.event .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,20,.92) 0,rgba(11,10,20,.55) 50%,rgba(11,10,20,.15))}
.event .wrap{position:relative;width:100%;padding-bottom:90px}
.event .box{max-width:560px}
.rates{display:grid;grid-template-columns:repeat(3,1fr);margin-top:34px;border-top:1px solid var(--line2)}
.rates div{padding:18px 18px 0 0}
.rates div+div{padding-left:18px;border-left:1px solid var(--line)}
.rates small{display:block;font-size:12px;color:var(--muted)}
.rates b{font-family:var(--num);font-size:32px;font-weight:300}
/* ผัง 3D */
.mapbox{position:relative;margin-top:56px;height:min(80vh,760px);border:1px solid var(--line);overflow:hidden;background:#100d24}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbox .cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,10,20,.55);cursor:pointer;transition:opacity .5s;border:0;width:100%}
.mapbox .cover span{padding:14px 26px;border:1px solid var(--line2);background:rgba(11,10,20,.6);backdrop-filter:blur(6px);font-size:14px;letter-spacing:.04em}
.mapbox.live .cover{opacity:0;pointer-events:none}
/* ติดต่อ + ท้ายหน้า */
.contact{display:grid;grid-template-columns:repeat(3,1fr);margin-top:56px;border-top:1px solid var(--line2)}
.contact>div{padding:30px 28px 30px 0}
.contact>div+div{padding-left:28px;border-left:1px solid var(--line)}
.contact h4{font-family:var(--serif);font-weight:300;font-size:26px}
.contact p{color:var(--muted);font-size:14px;margin-top:6px}
.contact a.tel{display:block;font-family:var(--num);font-size:34px;font-weight:300;text-decoration:none;margin-top:12px;line-height:1.2}
.contact a.ln{display:inline-block;margin-top:8px;font-size:14px;border-bottom:1px solid var(--line2);text-decoration:none}
footer{margin-top:150px;padding:56px 0 40px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .wrap{display:grid;grid-template-columns:auto 1fr;gap:20px 60px;align-items:start}
footer .brand{height:34px}
footer p+p{margin-top:4px}
footer .fine{grid-column:1/-1;padding-top:24px;border-top:1px solid var(--line)}

/* ── โผล่ตอนเลื่อนถึง ── */
.rv{opacity:0;transform:translateY(36px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}
@media (prefers-reduced-motion:reduce){ .rv{opacity:1;transform:none;transition:none} }

@media (max-width:900px){
  .wrap{padding:0 24px}
  .intro,.vend{grid-template-columns:1fr;gap:48px}
  .branches,.paths{grid-template-columns:1fr}
  .path,.path+.path{padding:40px 0;border-left:0}
  .path+.path{border-top:1px solid var(--line)}
  .contact{grid-template-columns:1fr}
  .contact>div,.contact>div+div{padding:26px 0;border-left:0;border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .top .wrap{height:62px}.brand{height:22px}
  .top nav a:not(.m){display:none}
  .copy{padding:0 16px}
  .sec{padding-top:110px}
  .br{min-height:520px}.br .in{padding:24px}.br h3{font-size:36px}.br .mono{font-size:84px}
  .item h4{font-size:22px}.item .p{font-size:28px}
  .rates b{font-size:24px}
  .event .wrap{padding-bottom:56px}
  footer .wrap{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top" id="top"><div class="wrap">
  <a class="brand" data-wm href="#" aria-label="ตลาดเซฟวัน GO"></a>
  <nav><a href="#about">ตลาด</a><a href="#branches">สาขา</a><a class="m" href="#visit">มาเดินตลาด</a><a class="m" href="#sell">มาขายของ</a><a href="#contact">ติดต่อ</a></nav>
</div></header>

<section class="dusk" id="dusk">
  <div class="pin">
    <div class="sky" id="sky"></div>
    <div class="sun" id="sun"></div>
    <div class="stars" id="stars"></div>
    <svg class="scene" id="scene" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="photo" id="photo"></div>
    <div class="copy">
      <p class="k" id="kick"><i></i></p>
      <h1>ตลาดเย็น<br>เซฟวัน โก</h1>
      <div class="clock"><b id="clock">16:00</b><span id="beat"></span></div>
    </div>
    <p class="cap" id="cap"></p>
    <p class="hint" id="hint">เลื่อนลง</p>
  </div>
</section>

<main id="main"></main>
<footer id="foot"></footer>

<script src="content/cms.js?v=20261028i"></script>
<script>
const { esc, get, phr } = CMS;
const $ = id => document.getElementById(id);
const ARROW = '<svg class="arrow" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 5h17M13 1l4 4-4 4"/></svg>';
const digits = s => String(s || '').replace(/[^\d+]/g, '');
const lineUrl = id => 'https://line.me/R/ti/p/' + encodeURIComponent(String(id || '').trim());
const ext = h => /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : '';
let C, VB = 'sg';   // VB = สาขาที่เลือกดูราคา

// ── ฉากเปิด: เลื่อน 0→1 = 16:00→23:00 ──
// ฟ้า 4 ช่วง (บน, ล่าง): บ่ายแก่ → อาทิตย์ตก → โพล้เพล้ → กลางคืน
const SKY = [[0, '#7d9cc9', '#f3cf9f'], [.33, '#46467f', '#f2915f'], [.62, '#1d1a44', '#7a3f6c'], [1, '#0b0a14', '#1c1736']];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const skyAt = p => { for (let i = 1; i < SKY.length; i++) if (p <= SKY[i][0]) { const [a, t0, b0] = SKY[i - 1], [z, t1, b1] = SKY[i], t = (p - a) / (z - a); return [mix(t0, t1, t), mix(b0, b1, t)]; } return [SKY[3][1], SKY[3][2]]; };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
let BEATS = [];   // [เวลาเป็นชั่วโมง, ข้อความ] มาจากข้อมูลจริง

// เงาตลาด: หลังคาเต็นท์ + ราวไฟ (วาดด้วยโค้ด · หลอดไฟติดทีละดวงตามเวลา)
function drawScene() {
  const svg = $('scene'), H = 420, roofs = [], bulbs = [];
  let x = -20, i = 0;
  while (x < 1640) {   // เต็นท์สูงต่ำสลับกัน
    const w = 90 + (i * 37 % 60), h = 70 + (i * 53 % 50), base = H - 60;
    roofs.push(`<path d="M${x} ${base}V${base - h + 26}L${x + w / 2} ${base - h}L${x + w} ${base - h + 26}V${base}Z" fill="#0a0912"/><rect class="glow" x="${x + 10}" y="${base - (h - 40) * .55}" width="${w - 20}" height="${(h - 40) * .55}" fill="url(#lamp)" opacity="0" data-t="${(.42 + (i * 0.618 % 1) * .3).toFixed(3)}"/>`);
    x += w + 6; i++;
  }
  // ราวไฟ 3 เส้น: โค้งห้อย
  [[0, 200, 1600, 230, 70], [0, 262, 1600, 250, 50], [0, 150, 1600, 175, 60]].forEach(([x0, y0, x1, y1, sag], r) => {
    const n = 34 + r * 6, pts = [];
    for (let k = 0; k <= n; k++) {
      const t = k / n, X = x0 + (x1 - x0) * t, Y = y0 + (y1 - y0) * t + Math.sin(t * Math.PI * 3) * sag * .5 + sag * .2;
      pts.push([X, Y]);
      if (k % 1 === 0) bulbs.push(`<circle class="bulb" cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${3.2 - r * .5}" data-t="${(.30 + ((k * 7 + r * 13) % 23) / 23 * .35).toFixed(3)}"/>`);
    }
    roofs.push(`<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1"/>`);
  });
  svg.innerHTML = `<defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd896"/><stop offset=".7" stop-color="#e08a45" stop-opacity=".55"/><stop offset="1" stop-color="#7a3a1c" stop-opacity="0"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0912"/><stop offset="1" stop-color="#050409"/></linearGradient></defs>
    ${roofs.join('')}${bulbs.join('')}<rect x="-20" y="${H - 62}" width="1660" height="80" fill="url(#ground)"/>`;
}
let sceneEls = null;
function dusk() {
  const sec = $('dusk'), r = sec.getBoundingClientRect(), span = sec.offsetHeight - innerHeight;
  const p = clamp(-r.top / span);
  const tSky = clamp(p / .78), tPhoto = clamp((p - .78) / .18);   // ช่วงท้าย: ภาพจริงจางเข้ามา
  const [a, b] = skyAt(tSky);
  $('sky').style.background = `linear-gradient(180deg,${a} 0%,${b} 100%)`;
  $('sun').style.top = (32 + tSky * 70) + '%';
  $('sun').style.opacity = clamp(1 - tSky * 1.6);
  $('stars').style.opacity = clamp((tSky - .5) * 2.2);
  sceneEls = sceneEls || { bulbs: [...document.querySelectorAll('#scene .bulb')], glow: [...document.querySelectorAll('#scene .glow')] };
  sceneEls.bulbs.forEach(el => el.classList.toggle('on', tSky >= +el.dataset.t));
  sceneEls.glow.forEach(el => el.setAttribute('opacity', (clamp((tSky - el.dataset.t) * 4) * .85).toFixed(2)));
  $('photo').style.opacity = tPhoto;
  $('photo').style.transform = `scale(${1.12 - tPhoto * .12})`;
  $('cap').style.opacity = tPhoto;
  $('scene').style.opacity = 1 - tPhoto * .9;
  // นาฬิกา 16:00 → 23:00 (ขั้นละ 10 นาที) + ข้อความตามช่วงเวลา
  const mins = Math.round((16 * 60 + tSky * 7 * 60) / 10) * 10, hh = Math.floor(mins / 60), mm = mins % 60;
  $('clock').textContent = `${hh}:${String(mm).padStart(2, '0')}`;
  const beat = BEATS.filter(([h]) => mins / 60 >= h).pop();
  if (beat && $('beat').dataset.h !== String(beat[0])) { $('beat').dataset.h = beat[0]; $('beat').innerHTML = phr(beat[1]); }
  $('hint').style.opacity = p < .04 ? 1 : 0;
  $('top').classList.toggle('solid', p >= .98);
}

// ── ตัวช่วยข้อมูล ──
const nums = s => String(s || '').match(/\d[\d,]*/g)?.map(n => +n.replace(/,/g, '')) || [];
// ช่วงราคาจองออนไลน์ของโซน (ทุกฤดู/ทุกวัน) → "100–130"
function range(Z) {
  const all = Z.rows.flatMap(r => nums(r.online));
  if (!all.length) return '';
  const lo = Math.min(...all), hi = Math.max(...all);
  return lo === hi ? lo.toLocaleString() : `${lo.toLocaleString()}–${hi.toLocaleString()}`;
}
const zonesOf = k => Object.entries(C[k].vendor.zones).filter(([, Z]) => range(Z));
const minPrice = k => Math.min(...zonesOf(k).flatMap(([, Z]) => Z.rows.flatMap(r => nums(r.online))));   // ราคาโคราชยังรอยืนยัน → ใช้ของประตูกรุงเทพ
const branchLink = (k, key) => get(C, `${k}.links.${key}`) || '';

function render() {
  const sg = C.sg, ko = C.korat;
  const hours = sg.facts[0]?.[2] || '16:00–23:00';
  $('kick').innerHTML = `<i></i>${esc(C.gate.kicker)} · ${esc(hours)}`;
  const ready = (sg.vendor.zones.food.facts.find(f => f[0] === 'clock')?.[2] || '').match(/พร้อมขาย (\d\d):(\d\d)/);
  BEATS = [[16, 'ตลาดเปิด · ผู้ค้าเริ่มตั้งร้าน'], [ready ? +ready[1] + ready[2] / 60 : 18, 'ไฟร้านติด · ร้านพร้อมขาย'], [22.5, 'เดินเล่น กินดึกได้ถึง ' + (hours.split('–')[1] || '23:00')]];
  const hero = ko.customer.photos.filter(([s]) => s);   // ภาพมุมสูงยามค่ำ (ภาพที่ 2 ถ้ามี)
  $('photo').style.backgroundImage = `url("${esc((hero[1] || hero[0] || [''])[0])}")`;
  $('cap').textContent = `ภาพ: สาขา${ko.name} ยามค่ำ`;

  const brCard = (k, i) => { const b = C[k], photo = (b.customer.photos || []).find(([s]) => s)?.[0];
    const map = branchLink(k, 'map'), tel = b.contact.phone;
    return `<article class="br rv d${i}"><div class="ph${photo ? '' : ' none'}"${photo ? ` style="background-image:url('${esc(photo)}')"` : ''}></div><span class="mono">0${i + 1}</span>
      <div class="in"><span class="code">${esc(b.tag)}</span><h3>${esc(b.name)}</h3><p class="where">${phr(b.where)}</p>
      <dl>${b.facts.map(f => `<div><dt>${esc(f[1])}</dt><dd>${esc(f[2])}</dd></div>`).join('')}</dl>
      <div class="acts">${map ? `<a class="btn" href="${esc(map)}"${ext(map)}>นำทาง ${ARROW}</a>` : ''}${tel ? `<a class="btn" href="tel:${digits(tel)}">โทร ${esc(tel)}</a>` : ''}<a class="btn" href="${esc(lineUrl(b.contact.lineCustomer))}" target="_blank" rel="noopener">LINE ${esc(b.contact.lineCustomer)}</a></div></div></article>`; };

  const ev = ko.vendor.event, evPhoto = ev.photos.find(([s]) => s)?.[0];
  $('main').innerHTML = `
  <section class="sec" id="about"><div class="wrap intro">
    <div><p class="k rv"><i></i>เกี่ยวกับตลาด</p>
      <p class="big rv d1" style="margin-top:22px">ตลาดเย็นที่เปิด<em>ทุกวัน</em> สำหรับคนเดินเล่น หาของกิน และผู้ค้าที่อยากเริ่มขาย โดย<em>ไม่มีค่าเซ้ง</em> ไม่ต้องมีล็อกประจำ</p></div>
    <div class="stats rv d2">
      <div class="stat"><b>${C.branchKeys.length}</b><small>สาขาที่เปิดอยู่</small></div>
      <div class="stat"><b>${esc(hours.split('–')[0])}</b><small>เปิดทุกวัน · ถึง ${esc(hours.split('–')[1] || '')}</small></div>
      <div class="stat"><b>${minPrice('sg')}</b><small>บาท · ค่าล็อกเริ่มต้นต่อวัน (${esc(sg.name)})</small></div>
      <div class="stat"><b>0</b><small>บาท · ค่าเซ้ง</small></div>
    </div>
  </div></section>

  <section class="sec" id="branches"><div class="wrap">
    <p class="k rv"><i></i>สาขา</p><h2 class="h2 rv d1">เลือกสาขาที่ใกล้คุณ</h2>
    <div class="branches">${C.branchKeys.map(brCard).join('')}</div>
  </div></section>

  <section class="sec"><div class="wrap">
    <p class="k rv"><i></i>วันนี้มาทำอะไร</p>
    <div class="paths">
      <a class="path rv" href="#visit"><span class="no">01</span><h3>${esc(C.gate.cus.title)}</h3><ul>${C.gate.cus.items.map(t => `<li>${phr(t)}</li>`).join('')}</ul><span class="go">ดูข้อมูลลูกค้า ${ARROW}</span></a>
      <a class="path rv d1" href="#sell"><span class="no">02</span><h3>${esc(C.gate.ven.title)}</h3><ul>${C.gate.ven.items.map(t => `<li>${phr(t)}</li>`).join('')}</ul><span class="go">ดูราคาและวิธีจอง ${ARROW}</span></a>
    </div>
  </div></section>

  <section class="sec" id="visit"><div class="wrap vend">
    <div><p class="k rv"><i></i>${esc(C.gate.cus.title)}</p><h2 class="h2 rv d1">หาร้านเจอ<br>ในไม่กี่วินาที</h2>
      <p class="lead rv d2">${phr(sg.customer.sub)}</p>
      <div class="cta rv d3"><a class="btn solid" href="${esc(C.links.findShop)}" target="_blank" rel="noopener">ตามหาร้านใน LINE ${ARROW}</a></div></div>
    <div class="menu rv d1">${C.branchKeys.map(k => `<div class="item"><h4>${esc(C[k].name)}</h4><span class="p" style="font-size:22px">${esc(C[k].facts[0][2])}<small>${esc(C[k].facts[0][1])}</small></span><p>${phr(C[k].customer.quick.find(q => q.ic === 'parking')?.sub || '')} · ${phr(C[k].where)}</p></div>`).join('')}</div>
  </div></section>

  <section class="sec" id="sell"><div class="wrap vend">
    <div><p class="k rv"><i></i>${esc(C.gate.ven.title)}</p><h2 class="h2 rv d1">เริ่มขายได้<br>ตั้งแต่พรุ่งนี้</h2>
      <p class="lead rv d2" id="vSub"></p>
      <div class="seg rv d2" id="vSeg">${C.branchKeys.map(k => `<button data-b="${k}">${esc(C[k].name)}</button>`).join('')}</div>
      <ol class="steps rv d3" id="vSteps"></ol>
      <div class="cta" id="vCta"></div></div>
    <div><div class="menu rv d1" id="vMenu"></div><p class="fine" id="vNote"></p></div>
  </div></section>

  ${evPhoto ? `<section class="event"><div class="ph" id="evPh" style="background-image:url('${esc(evPhoto)}')"></div><div class="wrap"><div class="box">
    <p class="k rv"><i></i>${esc(ev.title)} · สาขา${esc(ko.name)}</p><h2 class="h2 rv d1">พื้นที่สำหรับงานของคุณ</h2>
    <p class="lead rv d2" style="color:rgba(243,237,226,.8)">${phr(ev.sub)}</p>
    <div class="rates rv d3">${ev.rows.map(([a, p]) => `<div><small>${esc(a)}</small><b>${esc(p)}</b></div>`).join('')}</div>
    <p class="fine">${phr(ev.note)}</p>
    <div class="cta"><a class="btn" href="tel:${digits(ev.tel)}">สอบถาม ${esc(ev.tel)}</a></div></div></div></section>` : ''}

  <section class="sec" id="map"><div class="wrap">
    <p class="k rv"><i></i>ผังตลาด</p><h2 class="h2 rv d1">เดินดูตลาดก่อนมาจริง</h2>
    <p class="lead rv d2">ผัง 3 มิติของแต่ละสาขา แตะหมุดเพื่อดูโซน ที่จอดรถ และจุดบริการ</p>
    <div class="mapbox rv d2" id="mapbox"><button class="cover" id="mapCover"><span>แตะเพื่อเปิดผัง 3D</span></button></div>
  </div></section>

  <section class="sec" id="contact"><div class="wrap">
    <p class="k rv"><i></i>ติดต่อ</p><h2 class="h2 rv d1">คุยกับเรา</h2>
    <div class="contact rv d2">${C.branchKeys.map(k => { const c = C[k].contact; return `<div><h4>สาขา${esc(C[k].name)}</h4><p>โทร ${esc(c.phoneHours)}</p><a class="tel" href="tel:${digits(c.phone)}">${esc(c.phone)}</a>
      <a class="ln" href="${esc(lineUrl(c.lineVendor))}" target="_blank" rel="noopener">${c.lineCustomer !== c.lineVendor ? 'ผู้ค้า' : 'LINE'} ${esc(c.lineVendor)}</a>${c.lineCustomer !== c.lineVendor ? ` &nbsp; <a class="ln" href="${esc(lineUrl(c.lineCustomer))}" target="_blank" rel="noopener">ลูกค้า ${esc(c.lineCustomer)}</a>` : ''}</div>`; }).join('')}
      <div><h4>${esc(C.contact.company)}</h4><p>${phr(C.contact.address)}</p></div></div>
  </div></section>`;

  $('foot').innerHTML = `<div class="wrap"><span class="brand" data-wm></span><div><p>${esc(C.contact.company)}</p><p>${phr(C.contact.address)}</p></div><p class="fine">${phr(C.contact.footnote)}</p></div>`;
  $('vSeg').onclick = e => { const b = e.target.closest('button'); if (b) { VB = b.dataset.b; vendor(); } };
  vendor();
  // ผัง 3D: โหลดเมื่อแตะ (ไม่ให้แย่งการเลื่อนจอ และไม่โหลดหนักตั้งแต่เปิดหน้า)
  $('mapCover').onclick = () => {
    const f = document.createElement('iframe'); f.title = 'ผังตลาด 3D'; f.src = 'branch-flip.html?v=20261029a';
    f.onload = () => { try { f.contentWindow.postMessage({ pinGroup: null, content: C }, location.origin); } catch {} };
    $('mapbox').prepend(f); $('mapbox').classList.add('live');
  };
  fillWordmarks(); reveal();
}
function vendor() {
  const b = C[VB], V = b.vendor;
  document.querySelectorAll('#vSeg button').forEach(x => x.classList.toggle('on', x.dataset.b === VB));
  $('vSub').innerHTML = phr(V.sub);
  $('vMenu').innerHTML = zonesOf(VB).map(([z, Z]) => `<div class="item"><h4>${esc(Z.name)}</h4><span class="p">${esc(range(Z))}<small>บาท / ล็อก / วัน · จองออนไลน์</small></span><p>${phr(C.vendor.rules[z]?.sub || '')} · ${phr(Z.facts.find(f => f[0] === 'size')?.[2] || '')}</p></div>`).join('');
  $('vNote').innerHTML = 'ราคาขึ้นกับวันและฤดู · จองหน้างานแพงกว่าจองออนไลน์ · ' + phr(V.scope);
  $('vSteps').innerHTML = V.steps.items.filter(([t]) => t).map(([t, s]) => `<li><div><b>${phr(t)}</b><span>${phr(s)}</span></div></li>`).join('');
  const book = branchLink(VB, 'booking');
  $('vCta').innerHTML = (book ? `<a class="btn solid" href="${esc(book)}" target="_blank" rel="noopener">จองล็อก ${ARROW}</a>` : '')
    + `<a class="btn" href="${esc(lineUrl(b.contact.lineVendor))}" target="_blank" rel="noopener">LINE ผู้ค้า ${esc(b.contact.lineVendor)}</a><a class="btn" href="home.html">ระเบียบเต็ม</a>`;
}
let WM = null;
async function fillWordmarks() {
  try { WM = WM || await (await fetch('img/wordmark.svg')).text(); } catch { return; }
  document.querySelectorAll('[data-wm]').forEach(el => { if (!el.firstChild) el.innerHTML = WM; });
}
function reveal() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -12% 0px' });
  document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));
}
// ภาพลานจัดงาน: เลื่อนช้ากว่าหน้า (พารัลแลกซ์เบาๆ)
function parallax() {
  const ph = $('evPh'); if (!ph) return;
  const r = ph.parentElement.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return;
  ph.style.transform = `translateY(${((r.top + r.height / 2) - innerHeight / 2) * -.12}px)`;
}

drawScene();
let ticking = false;
addEventListener('scroll', () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { dusk(); parallax(); ticking = false; }); }, { passive: true });
addEventListener('resize', dusk);
dusk();
CMS.load().then(c => { C = c; render(); dusk(); }).catch(e => { $('main').innerHTML = `<p class="wrap sec">โหลดข้อมูลไม่ได้: ${esc(e.message)}</p>`; });
</script>
