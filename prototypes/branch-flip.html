<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เปลี่ยนสาขา 3D</title>
<!-- ตัวอย่าง: เปิดมาเห็นพื้นที่ตลาด 3 มิติ กดลูกศรแล้วผังพลิกไล่ทีละช่องเป็นอีกสาขา · มุมกล้องให้เจ้าของเลือก (ปุ่มขวาบน)
     หมุดบนผัง กดแล้วกล้องบินไปที่โซน + การ์ดรายละเอียด (แบบผังโซนโคราชเดิม)
     ประตูกรุงเทพ / บางนา = ผังสมมติ · โคราช = ผังจริง + รายละเอียดจากโปรเจกต์ผังโซน (tools/export-korat.mjs)
     โมเดล = รูปทรงในโค้ด + โมเดล Blender ของเรา · โลโก้ร้านบนหลังคาโคราช = เจ้าของสั่งใส่ (ปิดได้ที่ SHOW_LOGOS) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6f1e7; --muted:#b9b2c9; --panel:rgba(23,19,58,.72); --panel-solid:rgba(23,19,58,.94); --line:rgba(246,241,231,.18);
  --go:#84e62d; --bg:#17133a;
  --food:#ff8a3d; --boot:#b48cf0; --event:#2cc9b5; --park:#5aaeea; --spot:#f6f1e7; --warn:#ffd36b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;display:block;touch-action:none}

.top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.wm{height:32px;display:block}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(8px)}
.seg button{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg span{font-size:12px;color:var(--muted);padding:6px 4px 6px 10px;align-self:center}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools[hidden]{display:none}
.seg button:disabled{opacity:.4;cursor:default}
#zoomBtn{margin-left:4px;border:1px solid var(--line)}

.nav{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);z-index:3;transition:opacity .25s}
.arrow{flex:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .15s}
.arrow:hover{transform:scale(1.06)}
.arrow:disabled{opacity:.5;cursor:default;transform:none}
.label{min-width:220px;text-align:center;padding:10px 20px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);transition:opacity .25s,transform .25s}
.label.out{opacity:0;transform:translateY(6px)}
.label small{display:block;font-size:12px;color:var(--go);letter-spacing:.08em}
.label h2{font-size:24px;font-weight:600;line-height:1.3}
.label p{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--go)}
.note{position:fixed;left:16px;bottom:8px;font-size:11px;color:var(--muted);opacity:.8;z-index:3}
.angle{position:fixed;left:16px;top:64px;z-index:3;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:13px}
.angle[hidden]{display:none}
.angle button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:6px 12px;background:var(--go);color:var(--bg);cursor:pointer}
@media (max-width:520px){ .angle{top:auto;bottom:118px} }
.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}

/* หมุด: เหรียญ 3D วาดใน WebGL · ปุ่ม HTML โปร่งใสทับเหรียญไว้กด + ป้ายชื่อใต้เหรียญ (ตั้งตำแหน่งทุกเฟรม) */
.pins{position:fixed;inset:0;pointer-events:none;z-index:2;transition:opacity .25s}
.pins.hide{opacity:0}
.pins.hide .pin{pointer-events:none}
.pin{--c:var(--spot);--d:48px;position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:3px;
  font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.pin i{display:block;width:var(--d);height:var(--d);border-radius:50%}
.pin span{font-size:12px;font-weight:600;white-space:nowrap;padding:1px 9px;border-radius:999px;background:var(--panel-solid);border:1.5px solid var(--c);
  box-shadow:0 3px 10px rgba(0,0,0,.35);transition:background .15s,color .15s}
.pin span:empty,.pin.bare span{display:none}
.pin:hover span,.pin.on span{background:var(--c);color:var(--bg)}
.pin:focus-visible{outline:none} .pin:focus-visible i{outline:2px solid var(--c);outline-offset:3px}
.pin.food{--c:var(--food)} .pin.boot{--c:var(--boot)} .pin.event{--c:var(--event)} .pin.park{--c:var(--park)} .pin.moto{--c:var(--park)}
.pin.minor{opacity:0;pointer-events:none;transition:opacity .25s}
.pin.minor span{font-size:11px}
.pins.near .pin.minor{opacity:1;pointer-events:auto}
@media (max-width:720px){ .pin{--d:34px} .pin span{font-size:11px;padding:0 7px} }

/* การ์ดรายละเอียด: ขวาบนจอกว้าง · แผ่นล่างบนมือถือ */
.card{position:fixed;top:72px;right:16px;width:370px;max-height:calc(100% - 96px);overflow:auto;z-index:4;
  background:var(--panel-solid);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(10px);
  transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card.on{transform:none}
.card .x{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--c,var(--spot));color:var(--bg)}
.tag.food{--c:var(--food)} .tag.boot{--c:var(--boot)} .tag.event{--c:var(--event)} .tag.park{--c:var(--park)}
.card h2{font-size:21px;line-height:1.35;margin:8px 0 2px}
.where{font-size:13px;color:var(--muted)}
.sec{margin-top:14px}
.sec-h{font-size:13px;font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(132,230,45,.14);border:1px solid rgba(132,230,45,.35)}
.chip.no{background:rgba(227,107,107,.14);border-color:rgba(227,107,107,.45)}
.today{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(246,241,231,.07);border-left:4px solid var(--c,var(--spot))}
.today.food{--c:var(--food)} .today.boot{--c:var(--boot)} .today.event{--c:var(--event)} .today.park{--c:var(--park)}
.today small{display:block;font-size:12px;color:var(--muted)}
.today b{font-size:30px;line-height:1.2}
.today .u{font-size:13px;color:var(--muted)}
.today .sub{margin-top:4px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{padding:8px 10px;border-radius:12px;background:rgba(246,241,231,.05)}
.fact.w{grid-column:span 2}
.fact small{display:block;font-size:11px;color:var(--muted)}
.fact b{font-size:13px;font-weight:600}
small small,b small,span small{font-weight:400;color:var(--muted)}
.flow{list-style:none;counter-reset:s;display:grid;gap:8px}
.flow li{counter-increment:s;display:flex;gap:10px;font-size:13px}
.flow li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--go);color:var(--bg);font-weight:700;font-size:12px;display:grid;place-items:center}
.flow span{display:block;color:var(--muted);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none}
.btn.pri{background:var(--go);border-color:var(--go);color:var(--bg)}
.warn{margin-top:12px;font-size:12px;color:var(--warn)}
/* ช่องรูปจริง (ใส่ทีหลัง) · ช่องข้อมูลที่ยังไม่มี = กรอบเส้นประ */
.ph{margin-top:12px;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px}
.ph img{flex:none;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;scroll-snap-align:start}
.ph.empty{aspect-ratio:16/9;border:1.5px dashed var(--line);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;background:rgba(246,241,231,.03)}
.ph.empty small{display:block;font-size:11px;margin-top:2px}
.fact.todo{background:none;border:1px dashed var(--line)}
.fact.todo b{color:var(--muted);font-weight:400}
.lotimg{width:100%;border-radius:14px;display:block}
/* โหมดแก้ (เปิดจาก admin): ช่องที่แก้ได้มีเส้นประ */
.edit [data-p]{outline:1px dashed rgba(95,179,255,.6);outline-offset:2px;border-radius:4px;min-width:2em;display:inline-block;cursor:text}
.edit [data-p]:focus{outline:2px solid #5fb3ff;background:rgba(95,179,255,.12)}
.edit [data-p].empty{min-width:5em}
.edit [data-p].empty:not(:focus)::after{content:"พิมพ์…";color:#ffcf6b;opacity:.7;font-weight:400}
.muted{color:var(--muted);font-size:13px;margin-top:10px}

@media (max-width:720px){
  .card{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62%;border-radius:20px 20px 0 0;transform:translateY(105%)}
  body.carded .nav{opacity:0;pointer-events:none}
}
@media (max-width:520px){ .label{min-width:0} .label h2{font-size:20px} .seg button{padding:6px 8px;font-size:12px} .seg span{display:none} .tools{align-items:flex-start} }
</style>
</head>
<body>
<p class="loading" id="loading">กำลังโหลด…</p>
<div class="top" id="top">
  <img class="wm" src="../brand/ref-logos/logo-wordmark.svg" alt="ตลาดเซฟวัน GO">
  <div class="tools" hidden>
    <div class="seg" id="segView" role="group" aria-label="มุมกล้อง">
      <span>มุมกล้อง</span>
      <button data-view="home" aria-pressed="true">มุมหลัก</button>
      <button data-view="front" aria-pressed="false">ตรง</button>
      <button data-view="diagL" aria-pressed="false">เฉียงซ้าย</button>
      <button data-view="diagR" aria-pressed="false">เฉียงขวา</button>
      <button data-view="low" aria-pressed="false">เฉียงต่ำ</button>
      <button data-view="free" aria-pressed="false">อิสระ</button>
      <button id="zoomBtn" aria-pressed="false" title="ให้ซูมเองได้ (ล้อเมาส์/ถ่างนิ้ว)">🔍 ซูม</button>
    </div>
  </div>
</div>

<div class="pins" id="pins"></div>
<aside class="card" id="card" aria-hidden="true" aria-live="polite">
  <button class="x" id="cardX" aria-label="ปิดรายละเอียด">✕</button>
  <div id="cardBody"></div>
</aside>

<div class="nav" id="nav">
  <button class="arrow" id="prev" aria-label="สาขาก่อนหน้า">←</button>
  <div class="label" id="label"><small id="code"></small><h2 id="name"></h2><p id="sub"></p><div class="dots" id="dots"></div></div>
  <button class="arrow" id="next" aria-label="สาขาถัดไป">→</button>
</div>
<p class="note" id="hint">แตะหมุดดูรายละเอียด</p>
<div class="angle" id="angle" hidden><span id="angleTxt"></span><button id="angleSave">📌 ใช้มุมนี้เป็นมุมเปิด</button></div>

<script src="korat-layout.js?v=2"></script>
<script src="sg-layout.js?v=5"></script>
<script src="office-sign.js?v=2"></script>
<script src="models-embed.js?v=3"></script>   <!-- ?v= เปลี่ยนทุกครั้งที่สร้างไฟล์ใหม่ ไม่ให้เบราว์เซอร์ใช้ของเก่า -->
<script src="content/cms.js?v=1"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const SG_WC = new URLSearchParams(location.search).get('wc') || 'pin';   // ห้องน้ำประตูกรุงเทพ: pin | roof | both · ค่าเริ่ม = หมุดอย่างเดียว (ทั้งคู่แล้วซ้อนกัน)
const SHOW_LOGOS = true;   // โลโก้ร้านบนหลังคาโคราช · ร้านไหนขอเอาออก → ปิดที่นี่ หรือลบชื่อใน korat-layout.js

// ── สาขา ── ผังตาราง 14×9 ช่อง: R ถนน · . ลาน · T เต็นท์ · P ที่จอด · B ตึก · G หญ้า/ต้นไม้ · S ลานโต๊ะกิน · E ซุ้มทางเข้า
//            korat: true = สร้างจากพิกัดจริงใน korat-layout.js · sg: true = จาก sg-layout.js (กรอบที่เจ้าของวาด)
//            az = มุมหมุนกล้องของสาขานี้ในมุมบ้าน (ไม่ใส่ = ใช้มุมบ้านปกติ)
//            pins (ผังตาราง): [ข้อความ, ชนิด, [คอลัมน์ซ้าย, แถวบน, คอลัมน์ขวา, แถวล่าง]]
const BRANCHES = [
  { tag: 'สาขา SG', name: 'ประตูกรุงเทพ', sub: 'ผังจริงจากแผนที่ · แยก คปอ.', sg: true, az: 1 },   // az: เจ้าของสั่ง 28 ต.ค. 69 หมุนให้ฝั่งสำนักงาน (ทิศใต้) อยู่ใกล้
  { tag: 'สาขา SB', name: 'บางนา', sub: 'ผังสมมติ · ตลาดเย็น 16:00–23:00', map: [
    'RRRRRRRRRRRRRR',
    'BB.TTTTTTTT.GG',
    'BB.T......T.GG',
    '...T.SSSS.T...',
    'PP.T.SSSS.T.PP',
    'PP.T......T.PP',
    'PP.TTTTTTTT.PP',
    'GG....EE....GG',
    'GGGGGGGGGGGGGG',
  ], pins: [
    ['🍢 เต็นท์อาหาร', 'food', [3, 1, 10, 1]], ['🍽️ ลานโต๊ะกิน', 'event', [5, 3, 8, 4]], ['🅿️ ลานจอด', 'park', [0, 4, 1, 6]],
    ['🅿️ ลานจอด', 'park', [12, 4, 13, 6]], ['📍 สำนักงาน', 'spot', [0, 1, 1, 2]], ['🚪 ทางเข้า', 'spot', [6, 7, 7, 7]],
  ]},
  { tag: 'ตลาดเซฟวัน', name: 'โคราช', sub: 'ผังจริงจากแผนที่ตลาด', korat: true },
];
const COLS = 14, ROWS = 9;
BRANCHES.forEach(b => b.map && console.assert(b.map.length === ROWS && b.map.every(r => r.length === COLS), 'ผังผิดขนาด', b.name));

// ── ฉาก ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = (() => {           // ฟ้าเย็นย่ำ: ครามเข้มด้านบน → ส้มอิฐที่ขอบฟ้า
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#17133a'); gr.addColorStop(.5, '#2b2160'); gr.addColorStop(.8, '#5e3a73'); gr.addColorStop(1, '#b8604d');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

const camera = new THREE.PerspectiveCamera(35, 1, .02, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.screenSpacePanning = false;   // Ctrl+ลาก / คลิกขวาลาก = เลื่อนไปตามพื้น (แบบแผนที่) ไม่ใช่ขึ้นลงตามจอ
controls.minPolarAngle = .2; controls.maxPolarAngle = 1.35;   // เงยได้ 13°–78°
controls.minAzimuthAngle = -Infinity; controls.maxAzimuthAngle = Infinity;   // อิสระ: หมุนรอบได้ 360°
controls.target.set(0, 0, .4);

scene.add(new THREE.HemisphereLight('#8f86c8', '#2a2440', 1.35));
const sun = new THREE.DirectionalLight('#ffe0c4', 2.3);   // แดดเย็นต่ำๆ ทางซ้าย · อุ่นแต่ไม่ส้มจัด (ตึกไม่เป็นสีชมพู)
sun.position.set(-9, 7, 5); sun.castShadow = true;
const SUN0 = sun.position.clone();   // แดดของมุมบ้าน (มองจากหน้าตลาดโคราช) · สาขาที่หันกล้องต่างไป แดดหมุนตาม → ส่องข้าง-หลังเหมือนกันทุกสาขา ไม่ส่องเข้าหน้ากล้องจนจ้า
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
sun.shadow.bias = -.0003; sun.shadow.normalBias = .01;
scene.add(sun);

// วาดผ่านพื้นที่ที่ลบรอยหยักขอบ (MSAA 4 เท่า) — ค่าเริ่มต้นของ EffectComposer ไม่ลบ ขอบรางรถไฟ/เส้นบางๆ เลยหยักและกะพริบ
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .7, .45, .85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ── วัสดุ + รูปทรงใช้ซ้ำ ──
const MC = {};
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, ...o });
const mat = (color, o = {}) => { const k = color + JSON.stringify(o); return MC[k] || (MC[k] = std(color, o)); };
const glow = (color, k) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: k });
const TOPC = {   // สีพื้นช่อง (วาดลงภาพพื้น)

// สุ่มแบบคงที่: ช่องเดิม สาขาเดิม ได้หน้าตาเดิมทุกครั้ง

// ── ภาพพื้น: วาดผังทั้งแผ่นลง canvas แล้วแต่ละช่องโชว์ส่วนของตัวเอง → พลิกทีละช่องแล้วยังต่อกันเป็นภาพเดียว ──
const PX = 128;   // พิกเซลต่อ 1 ช่อง
function groundMat(draw) {

function grain(g, n, seed) {   // เม็ดผิวพื้นจางๆ ให้ไม่เรียบเป็นพลาสติก

// ── ของในแต่ละช่อง (สาขาผังตาราง) ──
function build(type, bi, r, c) {
  const g = new THREE.Group(), map = BRANCHES[bi].map, at = (rr, cc) => (map[rr] || '')[cc];
  const R = k => rnd(bi * 31 + k, r, c);
  switch (type) {
    case 'T': {                                     // เต็นท์ + โต๊ะ + ของ + หลอดไฟ
      for (const [x, z] of [[-.36, -.36], [.36, -.36], [-.36, .36], [.36, .36]]) g.add(part(GEO.cyl, M.pole, .03, .62, .03, x, .31, z));
      g.add(part(GEO.cone4, CANOPY_M[Math.floor(R(1) * CANOPY.length)], 1.12, .34, 1.12, 0, .79, 0, Math.PI / 4));
      g.add(part(GEO.box, M.table, .62, .06, .32, 0, .38, .12));
      for (let i = 0; i < 3; i++) g.add(part(GEO.box, GOODS_M[Math.floor(R(2 + i) * GOODS.length)], .12, .1, .12, -.2 + i * .2, .46, .12));
      g.add(part(GEO.sph, M.bulb, .09, .09, .09, 0, .58, 0));
      break;
    }
    case 'P': {                                     // ที่จอด: เส้นขาว + รถ (บางช่องว่าง)
      g.add(part(GEO.box, M.line, .02, .005, .8, -.47, .003, 0));
      if (R(1) < .7) {
        const m = CAR_M[Math.floor(R(2) * CAR.length)];
        g.add(part(GEO.box, m, .38, .16, .66, 0, .12, 0));
        g.add(part(GEO.box, M.glassB, .32, .14, .34, 0, .27, .04));
      }
      break;
    }
    case 'B': {                                     // ตึก: ช่องติดกันสูงเท่ากัน เลยดูเป็นตึกเดียว · กระจก 2 ชั้น · ขอบหลังคา · แอร์
      const h = 1.5;
      g.add(part(GEO.box, M.cream, 1, h, 1, 0, h / 2, 0));
      g.add(part(GEO.box, M.glassB, 1.006, .22, 1.006, 0, h * .3, 0));
      g.add(part(GEO.box, M.glassB, 1.006, .22, 1.006, 0, h * .62, 0));
      g.add(part(GEO.box, M.roof, 1, .04, 1, 0, h + .02, 0));
      g.add(part(GEO.box, M.cream, 1, .08, .04, 0, h + .04, -.48));
      if (R(1) < .6) g.add(part(GEO.box, mat('#f2f3f5'), .22, .12, .18, (R(2) - .5) * .5, h + .06, (R(3) - .5) * .5));
      break;
    }
    case 'G': {
      if (R(1) < .55) {
        g.add(part(GEO.cyl, M.trunk, .07, .3, .07, 0, .15, 0));
        g.add(part(GEO.ico, R(2) < .5 ? M.leaf : M.leaf2, .55, .6, .55, 0, .55, 0, R(3) * 3));
      } else if (R(1) < .8) g.add(part(GEO.ico, M.leaf2, .35, .22, .35, (R(4) - .5) * .4, .1, (R(5) - .5) * .4));
      break;
    }
    case 'R': {                                     // ถนน: เส้นประตามแนวถนน
      const along = at(r, c - 1) === 'R' || at(r, c + 1) === 'R';
      g.add(part(GEO.box, M.dash, along ? .4 : .06, .006, along ? .06 : .4, 0, .003, 0));
      break;
    }
    case 'S': {                                     // ลานโต๊ะกิน + ไฟราว
      g.add(part(GEO.cyl, M.table, .44, .04, .44, 0, .3, 0));
      g.add(part(GEO.cyl, M.pole, .05, .3, .05, 0, .15, 0));
      for (const a of [0, 2.1, 4.2]) g.add(part(GEO.cyl, M.table, .14, .16, .14, Math.cos(a + R(1)) * .32, .08, Math.sin(a + R(1)) * .32));
      for (let i = 0; i < 3; i++) g.add(part(GEO.sph, M.bulb, .06, .06, .06, -.33 + i * .33, .95, -.4));
      break;
    }
    case 'E': {                                     // ซุ้มทางเข้า: เสาที่ปลาย + คานเขียว GO
      if (at(r, c - 1) !== 'E') g.add(part(GEO.box, M.cream, .12, 1.25, .12, -.44, .625, 0));

      break;
    }
    case '.': {
      if (R(1) < .12) {                             // เสาไฟลาน
        g.add(part(GEO.cyl, M.pole, .04, 1, .04, 0, .5, 0));
        g.add(part(GEO.sph, M.lamp, .12, .12, .12, 0, 1.03, 0));

    }
  }

}

const MODELS = {};
async function loadModels() {
  const L = new GLTFLoader();
  await Promise.all(Object.entries(window.GLB || {}).map(async ([k, b64]) => {
    const bin = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0)).buffer;
    const g = await L.parseAsync(bin, '');
    g.scene.updateMatrixWorld(true);
    const parts = [];
    g.scene.traverse(o => { if (o.isMesh) {
      const geo = o.geometry.clone(); geo.applyMatrix4(o.matrixWorld);
      o.material.metalness = 0; o.material.roughness = .75;
      parts.push({ geo, mat: o.material });
    } });
    MODELS[k] = { parts, minY: new THREE.Box3().setFromObject(g.scene).min.y };
  }));
}

// ── โคราช: พิกัดจริง → แผ่น 14×9 (ย่อเท่ากันทั้งสองแกน ไม่บิดสัดส่วน · ขอบที่เหลือเป็นหญ้า) ──

  const poly = (b, col) => { path(b); g.fillStyle = col; g.fill(); };
  const line = (x0, y0, x1, y1, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(...P(x0, y0)); g.lineTo(...P(x1, y1)); g.stroke(); };

  g.lineJoin = 'round';

  line(388, 90, 1738, 24, 1.5, 'rgba(246,241,231,.45)'); line(388, 142, 1738, 76, 1.5, 'rgba(246,241,231,.45)');
  g.setLineDash([14, 14]); line(320, 120, 1800, 47, 2, '#d9cfa8'); g.setLineDash([]);
  K.lanes.slice(-2).forEach(([x0, y0, x1, y1]) => { g.setLineDash([6, 8]); line(x0, y0, x1, y1, 1.2, 'rgba(246,241,231,.6)'); g.setLineDash([]); });
  // ทางม้าลายที่ปากทางเข้าหลัก (GATE) และทางรถเข้า (LANE)

// ── ตัวช่วยสร้างผังจากพิกัดจริง (โคราช + ประตูกรุงเทพใช้ร่วมกัน) ──
//    kpF = พิกัดผัง → แผ่น · km = 1 เมตร = กี่หน่วยบนแผ่น · ของแต่ละชิ้นเข้ากลุ่มของช่องที่มันตั้งอยู่ (ช่องพลิกแล้วของไปด้วย)
function makeBuilder(kpF, km) {
  const groups = Array.from({ length: COLS * ROWS }, () => new THREE.Group());
  const IK = new Map();   // ของซ้ำ: ช่อง|ชื่อ → InstancedMesh ทีเดียว
  // a = มุมเอียงของช่อง (ตามแนวโซน) · ของที่วางจากจุดนี้หมุนตามทั้งตำแหน่งและทิศ
  const at = (x, y, a = 0) => {
    const [X, Z] = kpF(x, y);
    const c = THREE.MathUtils.clamp(Math.floor(X + COLS / 2), 0, COLS - 1), r = THREE.MathUtils.clamp(Math.floor(Z + ROWS / 2), 0, ROWS - 1);
    return { ti: r * COLS + c, x: X - (c - (COLS - 1) / 2), z: Z - (r - (ROWS - 1) / 2), a, cs: Math.cos(a), sn: Math.sin(a) };
  };
  // วางของ 1 ชิ้น: o = จุดยึดจาก at() · dx/y/dz เป็นเมตรตามแกนของช่อง · s = ขนาดเป็นเมตร
  const put = (o, key, geo, m, [dx, y, dz], s, ry = 0, color) => {
    const k = o.ti + '|' + key;
    if (!IK.has(k)) IK.set(k, { ti: o.ti, geo, mat: m, list: [] });
    const wx = dx * o.cs - dz * o.sn, wz = dx * o.sn + dz * o.cs;
    IK.get(k).list.push({ p: [o.x + wx * km, y * km, o.z + wz * km], s: s.map(v => v * km), ry: ry - o.a, color });
  };
  const putModel = (o, name, ry, scale = 1, [dx, dz] = [0, 0], y = 0) => {
    const m = MODELS[name]; if (!m) return false;
    m.parts.forEach((p, j) => put(o, name + j, p.geo, p.mat, [dx, y - m.minY * scale, dz], [scale, scale, scale], ry));
    return true;
  };
  const add = (o, mesh) => { groups[o.ti].add(mesh); return mesh; };
  const finish = () => {
    const o3 = new THREE.Object3D();
    for (const { ti, geo, mat: m, list } of IK.values()) {
      const im = new THREE.InstancedMesh(geo, m, list.length);
      list.forEach((it, i) => {
        o3.position.set(...it.p); o3.rotation.set(0, it.ry, 0); o3.scale.set(...it.s); o3.updateMatrix();
        im.setMatrixAt(i, o3.matrix);
        if (it.color) im.setColorAt(i, new THREE.Color(it.color));
      });
      im.castShadow = im.receiveShadow = !isLight(m) && !m.transparent;
      groups[ti].add(im);
    }
    return groups;
  };
  return { groups, at, put, putModel, add, finish, kp: kpF, km };
}
// ── ตึก: แบบผังโซนเดิมโคราช · ผนัง/หลังคาตามข้อมูล · ฐานเข้ม · กระจก · แถบป้ายสี · ขอบกันตกหลังคา · แอร์ ──
//    B.b = ขอบในพิกัดผัง · B.h = สูง (หน่วยผัง) · s = หน่วยแผ่นต่อหน่วยผัง · U = หน่วยผังต่อ 1 เมตร
function addBuilding(B, { at, put, add, kp: kpF }, s, U) {
  const cx = B.b.reduce((a, p) => a + p[0], 0) / B.b.length, cy = B.b.reduce((a, p) => a + p[1], 0) / B.b.length;
  const o = at(cx, cy), [AX, AZ] = kpF(cx, cy), h = B.h * s;
  const loc = (x, y) => { const [X, Z] = kpF(x, y); return [o.x + X - AX, o.z + Z - AZ]; };
  const pts = (k = 1) => B.b.map(([x, y]) => new THREE.Vector2(...loc(cx + (x - cx) * k, cy + (y - cy) * k)));
  const ext = (shp, depth, top, m, cast = true) => {
    const me = new THREE.Mesh(new THREE.ExtrudeGeometry(shp, { depth, bevelEnabled: false }), m);
    me.rotation.x = Math.PI / 2; me.position.y = top; me.castShadow = cast; me.receiveShadow = true;
    return add(o, me);
  };
  const wall = mat(B.wall || '#f2efe9'), roof = mat(B.roof || '#e3e5e8');
  ext(new THREE.Shape(pts()), h, h, [roof, wall]);
  ext(new THREE.Shape(pts(1.006)), h * .06, h * .06, mat('#7d7a86'), false);               // ฐานตึก
  const ring = new THREE.Shape(pts()); ring.holes.push(new THREE.Path(pts(.93)));

// ── ประตูกรุงเทพ: ผังจาก sg-layout.js (กรอบที่เจ้าของวาด เกลาขอบให้ตรง) · สไตล์เดียวกับโคราช ──
const SG = window.SG;
const SGB = (() => { const [x0, y0, x1, y1] = SG.frame; return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, s: Math.min((COLS - .4) / (x1 - x0), (ROWS - .4) / (y1 - y0)) }; })();
const sgp = (x, y) => [(x - SGB.cx) * SGB.s, (y - SGB.cy) * SGB.s];   // ภาพดาวเทียม → แผ่น (X, Z)
const SU = 1 / SG.mpp, SM = SGB.s * SU;                               // พิกเซลต่อเมตร · 1 เมตร = กี่หน่วยบนแผ่น
// เส้นโค้งเรียบ (ตัดมุมซ้ำ 3 รอบ) · ถนนวาดจากเส้นกลาง ไม่ใช่จากกรอบที่ลากมือ
const chaikin = (pts, n = 3) => {
  let p = pts;
  for (let k = 0; k < n; k++) {
    const q = [p[0]];
    for (let i = 0; i < p.length - 1; i++) { const a = p[i], b = p[i + 1]; q.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); }
    q.push(p[p.length - 1]); p = q;
  }
  return p;
};
const bandPoly = (line, w) => {
  const L = [], R = [];
  line.forEach((p, i) => {
    const a = line[Math.max(0, i - 1)], b = line[Math.min(line.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    L.push([p[0] - dy * w, p[1] + dx * w]); R.push([p[0] + dy * w, p[1] - dx * w]);
  });
  return [...L, ...R.reverse()];
};
const inPoly = (x, y, b) => {
  let c = false;
  for (let i = 0, j = b.length - 1; i < b.length; j = i++) { const [xi, yi] = b[i], [xj, yj] = b[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; }

// เดินตามเส้นทุก step เมตร → fn(x, y, ทิศ)
const alongLine = (line, stepM, fn) => {
  let carry = 0;
  for (let i = 0; i < line.length - 1; i++) {
    const [ax, ay] = line[i], [bx, by] = line[i + 1], L = Math.hypot(bx - ax, by - ay), d = [(bx - ax) / L, (by - ay) / L];
    for (let t = carry; t < L; t += stepM * SU) fn(ax + d[0] * t, ay + d[1] * t, d);
    carry = (carry - L) % (stepM * SU); if (carry < 0) carry += stepM * SU;
  }
};
const SGZ = Object.fromEntries(SG.zones.map(([id, name, kind, b, opt = {}]) => [id, { id, name, kind, b, ...opt }]));
const sgRoads = SG.roads.map(([name, line, w, main]) => { const L = line.length > 2 ? chaikin(line) : line; return { name, line: L, w, main, poly: bandPoly(L, w) }; });
const sgRail = chaikin(SG.rail, 4);
const onBoard = (x, y, m = 0) => { const [X, Z] = sgp(x, y); return Math.abs(X) < COLS / 2 - m && Math.abs(Z) < ROWS / 2 - m; };

// ช่องในโซน: แถวขนานแกน along ('x' = ตะวันออก–ตก · 'y' = เหนือ–ใต้) · ทุก module เมตรมีแถวตาม rows[].off
//   pitch = ระยะระหว่างช่องในแถว · half = ครึ่งขนาดรอยเท้า [ตามแถว, ขวางแถว] (เมตร) ต้องอยู่ในโซนทั้งช่อง
function sgFill(b, { along = 'x', pitch, module, rows, half }, fn) {
  const xs = b.map(p => p[0]), ys = b.map(p => p[1]);
  const [u0, u1, v0, v1] = along === 'x' ? [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)] : [Math.min(...ys), Math.max(...ys), Math.min(...xs), Math.max(...xs)];

let SGS = null;
function sgSlots() {   // ตำแหน่งเต็นท์/ล็อก/ช่องจอด (ใช้ทั้งเส้นบนพื้นและของ 3D) · จำนวนไม่ใช่ของจริง (เจ้าของบอก: ตัวเลขจริงใส่เป็นตัวหนังสือทีหลัง)

    if (k === 'boot') sgFill(z.b, { pitch: 3.2, module: 20.2, half: [1.4, 3.6], rows: [{ off: 8.55, d: -1 }, { off: 16.65, d: 1 }] }, (x, y, r) => S.boot.push([x, y, r.d]));

const sgGround = () => groundMat(g => {

const CACHE = [];

// ── หมุด: ตำแหน่งบนแผ่น + จุด/รัศมีที่กล้องจะบินไป + รูปโซนไว้ไฮไลต์ ──
function pinsFor(bi) {
  const b = BRANCHES[bi];
  if (b.sg) return SG.pins.filter(([, , kind]) => kind !== 'wc' || SG_WC !== 'roof').map(([id, label, kind]) => {
    const z = SGZ[id], B = SG.bld.find(B => B.name === id), b2 = z ? z.b : B ? B.b : null;
    const [px, py] = b2 ? [b2.reduce((a, p) => a + p[0], 0) / b2.length, b2.reduce((a, p) => a + p[1], 0) / b2.length] : SG.gate.pavilion;
    const [X, Z] = sgp(px, py), h = B ? B.h : id === 'gate' ? 8 : 0, poly = b2 ? b2.map(([x, y]) => sgp(x, y)) : null;
    let center = new THREE.Vector3(X, 0, Z), radius = 25 * SM;
    if (poly) {
      const xs = poly.map(p => p[0]), zs = poly.map(p => p[1]);
      center = new THREE.Vector3((Math.min(...xs) + Math.max(...xs)) / 2, 0, (Math.min(...zs) + Math.max(...zs)) / 2);
      radius = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs)) / 2 + 12 * SM;
    }
    return { label, kind, id, sg: true, poly, center, radius, a: 0, pos: new THREE.Vector3(X, h * SM + .04, Z) };
  });
  if (!b.korat) return b.pins.map(([label, kind, [c0, r0, c1, r1]]) => {
    const x0 = c0 - COLS / 2, x1 = c1 + 1 - COLS / 2, z0 = r0 - ROWS / 2, z1 = r1 + 1 - ROWS / 2;
    const center = new THREE.Vector3((x0 + x1) / 2, 0, (z0 + z1) / 2);
    return { label, kind, fake: true, name: label.replace(/^\S+\s/, ''), center, pos: center.clone().setY(.02),
      radius: Math.max(x1 - x0, z1 - z0) / 2 + .6, poly: [[x0, z0], [x1, z0], [x1, z1], [x0, z1]] };
  });
  return K.pins.map(([x, y, h, label, kind, id]) => {
    const [X, Z] = kp(x, y), zone = K.zones.find(z => z.id === id);
    const poly = zone ? zone.b.map(([zx, zy]) => kp(zx, zy)) : null;
    let center = new THREE.Vector3(X, 0, Z), radius = 40 * KB.s;
    if (poly) {

      center = new THREE.Vector3((Math.min(...xs) + Math.max(...xs)) / 2, 0, (Math.min(...zs) + Math.max(...zs)) / 2);
      radius = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs)) / 2 + 25 * KB.s;
    }
    return { label, kind, id, poly, center, radius, a: zone ? zone.a : 0, pos: new THREE.Vector3(X, (h + 6) * KB.s + .04, Z), minor: id === 'fountain' };
  });
}

  return { head, ground, kinds, beam: new THREE.CylinderGeometry(.012, .012, 1, 8).translate(0, .5, 0) };
}
function makePin3d(kind) {
  const k = pinKit.kinds[kind] || pinKit.kinds.spot, root = new THREE.Group(), head = new THREE.Group(), ground = new THREE.Group();
  pinKit.head.forEach(({ geo, part }) => head.add(Object.assign(new THREE.Mesh(geo, k[part]), { renderOrder: 10 })));
  pinKit.ground.forEach(({ geo, part }) => ground.add(new THREE.Mesh(geo, k[part])));
  const beam = Object.assign(new THREE.Mesh(pinKit.beam, k.beam), { renderOrder: 9 });
  root.add(head, ground, beam); pin3d.add(root);
  return { root, head, ground, beam };
}
function renderPins(bi) {
  pinLayer.innerHTML = ''; pin3d.clear();
  pinKit = pinKit || makePinKit();
  pinEls = branchData(bi).pins.map(p => {
    const el = document.createElement('button'), name = p.label.includes(' ') ? p.label.replace(/^\S+\s/, '') : '';
    el.type = 'button'; el.className = `pin ${p.kind}${p.minor ? ' minor' : ''}`;
    el.setAttribute('aria-label', name || p.label);
    el.innerHTML = '<i></i><span></span>'; el.lastChild.textContent = name;
    el.onclick = () => openCard(p, el);
    pinLayer.appendChild(el);
    return { p, el, m: pinKit && makePin3d(p.kind), w: 0, h: 0 };
  });
}
const pv = new THREE.Vector3(), pu = new THREE.Vector3();
function placePins() {
  const W = innerWidth, H = innerHeight, near = camera.position.distanceTo(controls.target) < home.d * .6;   // น้ำพุ โผล่เมื่อซูมเข้าจากมุมบ้าน
  pinLayer.classList.toggle('near', near);
  const off = pinLayer.classList.contains('hide'), wide = W > 720, D = wide ? 48 : 34, BASE = D * 1.15, MAXLIFT = wide ? 220 : 110;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  // วัดตำแหน่งบนจอ แล้วเรียงลำดับวาง: หมุดโซนที่มีชื่อก่อน → หมุด P ไม่มีชื่อ → หมุดย่อย · ในกลุ่มเดียวกัน ใกล้กล้อง (ล่างจอ) ก่อน
  const list = pinEls.map(q => {
    pv.copy(q.p.pos).project(camera); pu.copy(q.p.pos).setY(q.p.pos.y + 1).project(camera);
    if (!q.w) { q.el.classList.remove('bare'); q.w = Math.max(D, q.el.offsetWidth); q.h = q.el.offsetHeight; q.named = !!q.el.textContent; }
    return { q, x: (pv.x + 1) / 2 * W, y: (1 - pv.y) / 2 * H, up: Math.max(((1 - pu.y) / 2 * H - (1 - pv.y) / 2 * H) * -1, .001), front: pv.z < 1,
      rank: (q.p.minor ? 2 : q.named ? 0 : 1) };
  }).sort((a, b) => (a.rank - b.rank) || (b.y - a.y));
  // แถบบน (โลโก้) + ป้ายสาขาล่าง ถือว่าเป็นที่ที่มีของอยู่แล้ว หมุดห้ามทับ
  const placed = [$('top'), $('nav')].map(e => { const b = e.getBoundingClientRect(); return { x0: b.left, x1: b.right, y0: b.top, y1: b.bottom }; });
  const hit = r => placed.some(o => r.x0 < o.x1 + 4 && r.x1 + 4 > o.x0 && r.y0 < o.y1 + 4 && r.y1 + 4 > o.y0);
  const fit = (it, w, h) => {   // หาความสูงที่ไม่ทับใคร (ยกขึ้นก่อน → ไม่ได้ ลองย่อเส้นลง กรณีโซนอยู่ชิดขอบบนจอ) · ไม่ได้ = null
    const tryLift = lift => {
      const top = it.y - BASE - lift - D / 2, r = { x0: it.x - w / 2, x1: it.x + w / 2, y0: top, y1: top + h };
      return r.y0 > 0 && !hit(r) ? { lift, r } : null;
    };
    for (let lift = 0; lift <= MAXLIFT; lift += 6) { const f = tryLift(lift); if (f) return f; }
    for (let lift = -6; lift >= -(BASE - D * .35); lift -= 6) { const f = tryLift(lift); if (f) return f; }   // เส้นแสงเหลืออย่างน้อย ~1/3 เหรียญ
    return null;
  };
  for (const it of list) {
    const { q } = it;
    let show = it.front && !off && !pinHidden(q.p) && (!q.p.minor || near), lift = 0, bare = false;
    if (show) {   // ที่ไม่พอ: ซ่อนชื่อก่อน (เหลือเหรียญ) → ยังไม่พอ ซ่อนทั้งหมุด (แตะหมุดใกล้ๆ หรือกล้องบินเข้าไปแล้วจะโผล่)
      let f = fit(it, q.w, q.h);
      if (!f && q.named) { f = fit(it, D, D); bare = !!f; }
      if (f) { lift = f.lift; placed.push(f.r); } else show = false;
    }
    q.el.classList.toggle('bare', bare);
    q.el.style.visibility = show ? '' : 'hidden';
    q.el.style.transform = `translate(${(it.x - (bare ? D : q.w) / 2).toFixed(1)}px,${(it.y - BASE - lift - D / 2).toFixed(1)}px)`;
    if (!q.m) continue;
    q.m.root.visible = show;
    if (!show) continue;
    const s = D * (2 * camera.position.distanceTo(q.p.pos) * tanV / H) / PIN_D, hW = (BASE + lift) / it.up;   // s = ขนาดให้เหรียญกว้าง D px · hW = ความสูงเหรียญเหนือพื้น
    q.m.root.position.copy(q.p.pos);
    q.m.head.position.y = hW; q.m.head.scale.setScalar(s * (q.el.classList.contains('on') ? 1.15 : 1));
    q.m.head.rotation.y = Math.atan2(camera.position.x - q.p.pos.x, camera.position.z - q.p.pos.z);
    q.m.ground.scale.setScalar(s);
    q.m.beam.scale.set(s, Math.max(hW - PIN_TIP * s, .001), s);
  }
}
function highlight(p) {
  if (hl) { platform.remove(hl); hl.traverse(o => o.geometry && o.geometry.dispose()); hl = null; }
  if (!p || !p.poly) return;
  const col = KCOL[p.kind], g = new THREE.Group();
  const fill = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(p.poly.map(([x, z]) => new THREE.Vector2(x, -z)))),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: .3, depthWrite: false }));
  fill.rotation.x = -Math.PI / 2; fill.position.y = .014;
  const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(p.poly.map(([x, z]) => new THREE.Vector3(x, .02, z))),
    new THREE.LineBasicMaterial({ color: col }));
  g.add(fill, edge); platform.add(g); hl = g;
}
function openCard(p, el) {
  if (busy) return;
  sel = p;
  pinEls.forEach(q => q.el.classList.toggle('on', q.el === el));
  $('cardBody').innerHTML = cardHtml(p).replace('<!--ph-->', photoSlot(p)); card.scrollTop = 0;
  card.classList.add('on'); card.setAttribute('aria-hidden', 'false'); document.body.classList.add('carded');
  highlight(p);
  const v = focusView(p); flyTo(v.p, v.t);
}
function closeCard(fly = true) {
  if (!sel) return;
  sel = null; highlight(null);
  pinEls.forEach(q => q.el.classList.remove('on'));
  card.classList.remove('on'); card.setAttribute('aria-hidden', 'true'); document.body.classList.remove('carded');
  if (fly) flyTo(home.p, home.t);
}
$('cardX').onclick = () => closeCard();
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

// ── ท่าพลิก 3 แบบ ──
const FLIPS = {
  // 1 พลิกทั้งแผ่น: ยกขึ้น หมุนตะแคง 90° เปลี่ยนผังตอนแผ่นตั้งฉาก แล้วหมุนกลับจากอีกด้าน
  card(next, dir, swapLabel, end) {
    tween(560, 0, k => { const e = easeIn(k); platform.rotation.z = -dir * e * Math.PI / 2; platform.position.y = e * 1.4; },
      () => {
        tiles.forEach(t => setTile(t, next)); swapLabel(); platform.rotation.z = dir * Math.PI / 2;
        tween(700, 0, k => { const e = easeOut(k); platform.rotation.z = dir * (1 - e) * Math.PI / 2; platform.position.y = (1 - e) * 1.4; }, end);
      });
  },
  // 2 พลิกไล่ทีละช่อง: แต่ละช่องพลิกเอง เริ่มจากฝั่งลูกศร ไล่เป็นคลื่น
  wave(next, dir, swapLabel, end) {
    let left = tiles.length;
    for (const t of tiles) {
      const { r, c } = t.userData, order = dir > 0 ? c : COLS - 1 - c;
      const delay = order * 55 + r * 18;
      tween(260, delay, k => { t.rotation.z = -dir * easeIn(k) * Math.PI / 2; t.position.y = k * .5; },
        () => {
          setTile(t, next); t.rotation.z = dir * Math.PI / 2;
          tween(320, 0, k => { const e = easeOut(k); t.rotation.z = dir * (1 - e) * Math.PI / 2; t.position.y = (1 - e) * .5; },
            () => { if (--left === 0) end(); });
        });
    }
    tween(1, 20 * COLS + 260, () => {}, swapLabel);
  },
  // 3 ยุบแล้วโผล่: ของยุบลงพื้นจากกลางออกขอบ แล้วของสาขาใหม่เด้งขึ้น
  rise(next, dir, swapLabel, end) {
    let left = tiles.length;
    for (const t of tiles) {
      const { r, c, content } = t.userData;
      const d = Math.hypot(c - (COLS - 1) / 2, r - (ROWS - 1) / 2), delay = d * 45;
      tween(240, delay, k => { content.scale.set(1, Math.max(1 - easeIn(k), .001), 1); },
        () => {
          setTile(t, next);
          tween(480, 20, k => { content.scale.set(1, Math.max(easeOutBack(k), .001), 1); },
            () => { content.scale.set(1, 1, 1); if (--left === 0) end(); });
        });
    }
    tween(1, 300, () => {}, swapLabel);
  },
};

// ── ป้ายชื่อสาขา ──
$('dots').innerHTML = BRANCHES.map(() => '<i></i>').join('');
function showLabel(bi) {
  const b = BRANCHES[bi];
  $('code').textContent = b.tag; $('name').textContent = b.name; $('sub').textContent = b.sub;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === bi));
}

function go(dir) {
  if (busy) return;
  const next = (cur + dir + BRANCHES.length) % BRANCHES.length;
  busy = true; $('prev').disabled = $('next').disabled = true;
  if (VIEWS[view].rotate) { Object.assign(VIEWS[view], camAngle()); applyView(view, false); }   // อิสระ: พลิกแล้วคงมุมที่หมุนไว้
  viewBi = next;
  if (!VIEWS[view].rotate) VIEW_DIR.copy(dirOf(VIEWS[view].el, viewAz()));   // สาขาที่มีมุมของตัวเอง → กล้องหมุนไปมุมนั้น
  aimSun();
  computeHome();   // มุมบ้านของสาขาถัดไป (โคราชเฟรมแคบกว่าผังตาราง)
  closeCard(false); flyTo(home.p, home.t, 1100);   // ช้าพอให้หมุนอ้อมไปมุมของสาขาถัดไปได้นุ่ม
  branchData(next);   // สร้างของสาขาถัดไปก่อนเริ่มพลิก ไม่ให้สะดุดกลางท่า
  $('label').classList.add('out'); pinLayer.classList.add('hide');
  const swapLabel = () => { showLabel(next); $('label').classList.remove('out'); };
  const end = () => {
    cur = next; busy = false; $('prev').disabled = $('next').disabled = false;
    renderPins(cur); pinLayer.classList.remove('hide');
  };
  if (reduced) { tiles.forEach(t => setTile(t, next)); swapLabel(); end(); return; }
  FLIPS[mode](next, VIEW_DIR.z < 0 ? -dir : dir, swapLabel, end);   // มองจากหน้าตลาด ซ้าย-ขวาบนจอกลับด้าน → คลื่นยังวิ่งจากฝั่งลูกศรที่กด
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
document.querySelectorAll('#segView button[data-view]').forEach(b => b.onclick = () => { if (!busy) applyView(b.dataset.view); });
$('zoomBtn').onclick = () => { if (busy) return; zoomOn = !zoomOn; applyView(view); };
$('angleSave').onclick = () => {
  const a = camAngle();
  VIEWS.mine = { ...a, fit: true, rotate: false };
  try { localStorage.setItem('flip-mine', JSON.stringify(a)); } catch {}
  console.log('[มุมของฉัน]', a);
  addMineBtn(); applyView('mine');
};
addMineBtn();

// ── ขนาดจอ: ถอยกล้องให้แผ่นตลาดพอดีจอ ทั้งจอกว้างและมือถือ ──
function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  computeHome();
  pinEls.forEach(q => (q.w = 0));   // ขนาดหมุดเปลี่ยนตามจอ → วัดป้ายใหม่
  const v2 = sel ? focusView(sel) : home;
  camera.position.copy(v2.p); controls.target.copy(v2.t);
}
addEventListener('resize', resize);

await Promise.all([loadModels(), document.fonts.ready, CMS.load().then(c => { SITE = SITE || c; }, e => console.warn(e.message))]);
if (CMS.EDIT) {   // admin: แก้ในการ์ด → ส่งให้หน้าแม่เก็บ/บันทึก
  document.body.classList.add('edit');
  CMS.bind(card, { get vendor() { return SITE.vendor; }, get contact() { return SITE.contact; }, get links() { return SITE.links; }, get sgMap() { return SITE.sgMap; } },
    (p, v) => parent !== window && parent.postMessage({ patch: { p, v } }, location.origin), () => {});
}
if (new URLSearchParams(location.search).has('cam')) document.querySelector('.tools').hidden = false;   // ปุ่มหามุมกล้อง (สำหรับจัดมุมใหม่)
tiles.forEach(t => setTile(t, cur)); showLabel(cur); applyView(view, false); resize(); renderPins(cur);
$('loading').remove();
// เลื่อนได้ไม่เกินขอบแผ่น: ถ้าจุดเล็งหลุดขอบ ดึงทั้งจุดเล็งและกล้องกลับเท่ากัน (มุมไม่เพี้ยน)
const panPull = new THREE.Vector3();
function keepOnBoard() {
  if (flight) return;
  const t = controls.target;
  panPull.set(THREE.MathUtils.clamp(t.x, -COLS / 2, COLS / 2) - t.x, 0, THREE.MathUtils.clamp(t.z, -ROWS / 2, ROWS / 2) - t.z);
  if (panPull.lengthSq()) { t.add(panPull); camera.position.add(panPull); }
}
renderer.setAnimationLoop(now => { runTweens(now); controls.update(); keepOnBoard(); placePins(); showAngle(); composer.render(); });
window.__flip = { go, setMode: m => (mode = m), platform, tiles, camera, controls, pins: () => pinEls };   // ใช้ทดสอบจากคอนโซล
</script>
