<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิธีจอง · ตลาดเซฟวัน โก</title>
<script>{ let t; try { t = localStorage.getItem('theme'); } catch {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b/style.css?v=20261030c">
</head>
<body>
<main id="main"></main>
<script src="content/cms.js?v=20261030a"></script>
<script src="b/common.js?v=20261030d"></script>
<script>
// ขั้นตอนเริ่มขาย + ช่วงเวลาจองออนไลน์/Walk-in ของแต่ละโซน + ลิงก์ผู้ค้า (จองล็อก · แจ้งปัญหา · ดูกล้อง)
page((C, k) => {
  const b = C[k], V = b.vendor, steps = V.steps.items.filter(([t]) => t);
  const when = zonesOf(C, k).map(([z, Z]) => { const f = key => Z.facts.find(x => x[0] === key)?.[2] || '';
    return `<tr><td><span class="zdot z-${z}"></span>${esc(Z.name)}</td><td>${dayTag(f('online'))}</td><td>${dayTag(f('walk'))}</td></tr>`; }).join('');
  return `${pageHead(C.gate.ven.title, 'online', `วิธีจอง <span class="br">· ${esc(b.name)}</span>`, `เริ่มขายใน ${steps.length} ขั้น`)}
  <section class="sec" style="padding-top:28px"><div class="wrap">
    ${branchTabs(C, k)}
    ${!hasVendor(C, k) ? waitBox(C, k, 'การจอง') : `<h2 class="h3" style="margin-top:32px">${esc(V.steps.title || 'เริ่มขายครั้งแรก')}</h2>
    <ol class="steps">${steps.map(([t, s]) => `<li class="rv"><b>${phr(t)}</b><span>${phr(s)}</span></li>`).join('')}</ol>
    ${V.steps.note ? `<p class="note">${phr(V.steps.note)}</p>` : ''}

    <h2 class="h3">เวลาจอง</h2>
    <div class="tbl rv"><table><thead><tr><th>โซน</th><th>จองออนไลน์</th><th>จอง Walk-in</th></tr></thead><tbody>${when}</tbody></table></div>
    <p class="note">ราคาแต่ละโซนดูที่ <a href="prices-b.html?b=${k}" style="color:var(--link);font-weight:600">หน้าราคา</a></p>

    <h2 class="h3">ลิงก์สำหรับผู้ค้า</h2>
    ${quickCards(C, k, V.quick)}`}
  </div></section>`;
});
</script>
<script src="b/switch.js?v=20261030b"></script>
</body>
</html>
