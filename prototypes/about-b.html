<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เกี่ยวกับเรา · ตลาดเซฟวัน โก</title>
<script>{ let t; try { t = localStorage.getItem('theme'); } catch {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b/style.css?v=20261031a">
<style>
/* เกี่ยวกับเรา (31 ต.ค. 69): ข้อมูลบริษัทรวมที่เดียว · 2 บริษัทแยกการ์ดชัด (SaveoneGo = ประตูกรุงเทพ+บางนา · Saveone Market = โคราช) */
.co{display:flex;flex-direction:column;gap:14px}
.co .logo{height:44px;display:flex;align-items:center;--wm-ink:var(--head);--wm-go:var(--acc)}
.co .logo svg{height:40px;width:auto}
.co .mk{width:84px;height:52px;background:var(--head);-webkit-mask:url(img/market-logo.png) left center/contain no-repeat;mask:url(img/market-logo.png) left center/contain no-repeat}
.co h2{font-size:24px;line-height:1.3;color:var(--head)}
.co .brs{display:flex;flex-wrap:wrap;gap:8px}
.co .brs a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card2);color:var(--head);font-weight:600;font-size:15px}
.co .brs a:hover{color:var(--link)}
.co .addr{font-size:15px;color:var(--sub);line-height:1.6}
.soon{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:18px;padding:20px 24px;border-radius:22px;border:2px dashed var(--line);color:var(--sub)}
.soon b{font-size:18px;color:var(--head)}
.soon .tag{padding:4px 12px;border-radius:999px;background:var(--kick-bg);color:var(--kick);font-weight:600;font-size:14px}
@media (max-width:720px){.grid2.cos{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="main"></main>
<script src="content/cms.js?v=20261030a"></script>
<script src="b/common.js?v=20261031a"></script>
<script>
page((C) => {
  const S = C.story, by = re => C.keys.filter(k => re.test(S.brand[k] || ''));
  const br = k => `<a href="branches-b.html?b=${k}">${ic('pin')}${esc(C[k].name)}</a>`;
  const fbOf = ks => ks.map(k => get(C, `${k}.links.facebook`)).find(Boolean);
  const go = by(/go/i), mk = by(/market/i);
  const goFb = fbOf(go), mkFb = fbOf(mk), mkLine = mk[0] && C[mk[0]].contact.lineCustomer;
  return `${pageHead('เกี่ยวกับเรา', 'store', 'ไนท์มาร์เก็ต เปิดทุกวัน', 'ตลาดเซฟวันมี 2 บริษัทดูแล แยกกันตามพื้นที่')}
  <section class="sec" style="padding-top:36px"><div class="wrap">
    <div class="grid2 cos" style="margin-top:0">
      <div class="card co rv"><span class="logo" data-wm></span>
        <h2>${esc(C.contact.company)}</h2>
        <div class="brs">${go.map(br).join('')}</div>
        <p class="addr">${phr(C.contact.address)}</p>
        <div class="cta">${C.contact.lineOfficial ? `<a class="btn pri sm" href="${esc(lineUrl(C.contact.lineOfficial))}" target="_blank" rel="noopener">${ic('chat')} LINE ${esc(C.contact.lineOfficial)}</a>` : ''}
          ${goFb ? `<a class="btn alt sm" href="${esc(goFb)}" target="_blank" rel="noopener">${ic('fb')} Facebook</a>` : ''}</div></div>
      ${mk.length ? `<div class="card co rv"><span class="logo"><span class="mk" role="img" aria-label="Saveone Market ตลาดเซฟวัน"></span></span>
        <h2>Saveone Market</h2>
        <div class="brs">${mk.map(br).join('')}</div>
        <p class="addr">${phr(C[mk[0]].where)}</p>
        <div class="cta">${mkLine ? `<a class="btn pri sm" href="${esc(lineUrl(mkLine))}" target="_blank" rel="noopener">${ic('chat')} LINE ${esc(mkLine)}</a>` : ''}
          ${mkFb ? `<a class="btn alt sm" href="${esc(mkFb)}" target="_blank" rel="noopener">${ic('fb')} Facebook</a>` : ''}</div></div>` : ''}
    </div>
    <div class="soon rv"><span class="tag">Coming Soon</span><b>สาขาใหม่ · เร็วๆ นี้</b><span>ติดตามได้ทาง LINE และ Facebook</span></div>
    <div class="info one rv"><div><h4>ติดต่อเรื่องธุรกิจ · ร่วมงานกับเรา</h4>
      <p style="margin-top:6px;font-size:15px">ทัก LINE หรือโทรหาสำนักงานของสาขาที่สนใจ</p>
      <div class="cta" style="margin-top:12px"><a class="btn alt sm" href="contact-b.html">${ic('phone')} เบอร์โทรทุกสาขา</a></div></div></div>
  </div></section>`;
});
</script>
<script src="b/switch.js?v=20261030b"></script>
</body>
</html>
