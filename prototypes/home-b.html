<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตลาดเซฟวัน โก</title>
<!-- เว็บสไตล์ B แยกหลายหน้า (เจ้าของสั่ง 29 ต.ค. 69): หน้าแรก · สาขา · ราคา · วิธีจอง · ระเบียบ · ติดต่อ
     ส่วนร่วมอยู่ b/style.css + b/common.js · ข้อมูลจาก content/ ชุดเดียวกับ home.html -->
<script>{ let t; try { t = localStorage.getItem('theme'); } catch {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b/style.css?v=20261030d">
</head>
<body>
<main id="main"></main>
<script src="content/cms.js?v=20261030a"></script>
<script src="b/common.js?v=20261030e"></script>
<script>
page((C) => {
  const sg = C.sg, hours = sg.facts[0]?.[2] || '16:00–23:00', st = openStatus(hours);
  const hero = photos(C, 'korat')[0] || ['', ''];
  const minSg = Math.min(...zonesOf(C, 'sg').flatMap(([, Z]) => Z.rows.flatMap(r => nums(r.online))));
  const names = C.keys.map(k => esc(C[k].name)).join(' · ');
  const door = (h, icon, t, s) => `<a class="door rv" href="${h}">${ic(icon)}<b>${t}</b><small>${s}</small><span class="go">ดูต่อ →</span></a>`;
  const brCard = k => { const b = C[k], ph = photos(C, k)[0];
    return `<a class="br-card rv" href="branches-b.html?b=${k}"><div class="ph${ph ? '' : ' none'}"${ph ? ` style="background-image:url('${esc(ph[0])}')"` : ''}>${ph ? '' : '<span>รอรูปสาขา</span>'}</div>
      <div class="bd"><span class="tag">${esc(b.tag)}</span><h3>${esc(b.name)}</h3><p class="where">${phr(b.where)}</p>
      <div class="hours">${hasInfo(C, k) ? b.facts.filter(f => f[2]).map(f => `<span>${esc(f[1])} <b>${esc(f[2])}</b></span>`).join('') : '<span>ยังไม่มีข้อมูล · เร็วๆ นี้</span>'}</div></div></a>`; };
  return `
  <section class="hero"><div class="wrap">
    <div><span class="kick">${ic('clock')} เปิดทุกวัน ${esc(hours)}</span>
      <h1>ตลาด<em>เซฟวัน โก</em></h1>
      <p class="sub">${C.keys.length} สาขา: ${names} — มาเดินเล่นหาของกิน หรือมาเป็นผู้ค้ากับเรา</p>
      <div class="btns"><a class="btn pri" href="branches-b.html">${ic('bag')} ${esc(C.gate.cus.title)}</a><a class="btn alt" href="prices-b.html">${ic('store')} ${esc(C.gate.ven.title)}</a></div></div>
    <figure class="shot"><img src="${esc(hero[0])}" alt="${esc(hero[1])}"><span class="status${st.open ? ' open' : ''}"><i></i>${esc(st.text)} <small>(${esc(sg.name)})</small></span><figcaption>${esc(hero[1])}</figcaption></figure>
  </div></section>

  <div class="wrap"><div class="stats">
    <div class="stat rv"><b>${C.keys.length} สาขา</b><span>${names}</span></div>
    <div class="stat rv"><b>${esc(hours.split('–')[0])}</b><span>เปิดทุกวัน ถึง ${esc(hours.split('–')[1])}</span></div>
    <div class="stat rv"><b>${minSg} บาท/ล็อก</b><span>ค่าล็อกเริ่มต้น/วัน (${esc(sg.name)})</span></div>
  </div></div>

  <section class="sec"><div class="wrap">
    <span class="kick">${ic('bag')} ${esc(C.gate.cus.title)}</span><h2 class="h2">มาเดินตลาด</h2>
    <div class="doors">
      ${door('branches-b.html', 'pin', 'สาขาและเวลาเปิด', 'ที่ตั้ง นำทาง ที่จอดรถ ดูกล้อง และผังตลาด 3D')}
      ${door('contact-b.html', 'phone', 'ติดต่อตลาด', 'เบอร์โทร LINE ของแต่ละสาขา')}
    </div>
  </div></section>

  <section class="sec"><div class="wrap">
    <span class="kick">${ic('store')} ${esc(C.gate.ven.title)}</span><h2 class="h2">มาขายของ</h2>
    <div class="doors">
      ${door('prices-b.html', 'tag', 'ราคาค่าล็อก', 'ราคาแต่ละโซน แยกตามฤดูและวัน · ขายอะไรได้บ้าง')}
      ${door('booking-b.html', 'online', 'วิธีจอง', 'เริ่มขายครั้งแรก · จองออนไลน์ / Walk-in')}
      ${door('rules-b.html', 'list', 'ระเบียบตลาด', 'เวลาเข้าพื้นที่ มาสาย แจ้งลา คะแนน สิทธิ์ และคำถามที่พบบ่อย')}
    </div>
  </div></section>

  <section class="sec"><div class="wrap">
    <span class="kick">${ic('pin')} สาขา</span><h2 class="h2">เลือกสาขาที่ใกล้คุณ</h2>
    <div class="branches">${C.keys.map(brCard).join('')}</div>
  </div></section>`;
});
</script>
<script src="b/switch.js?v=20261030b"></script>
</body>
</html>
