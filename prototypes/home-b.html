<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตลาดเซฟวัน โก</title>
<!-- หน้าแรกสไตล์ B "กลางคืนสีสด" (เจ้าของเลือก 29 ต.ค. 69 จาก style-options.html) · ฟอนต์ Prompt · 2 ธีม สว่าง/มืด
     กฎของแบบนี้: หัวข้อ / เนื้อความ / ราคา / ป้ายโซน / ปุ่ม คนละสีเสมอ (เจ้าของ: "ตัวหนังสือสีเหมือนกันหมด แยกไม่ออก ไม่อยากอ่าน")
     ข้อมูลทั้งหมดอ่านจาก content/ ชุดเดียวกับหน้าแรกเดิม (cms.js) · ราคาเปลี่ยนตามฤดู/วันอัตโนมัติจากข้อมูล -->
<script>   // ธีมตั้งก่อนวาด ไม่ให้จอกะพริบ: ที่เลือกไว้ > ตามเครื่อง
{ let t; try { t = localStorage.getItem('theme'); } catch {}
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── สี 2 ธีม (ความหมายสีเหมือนกัน: ราคา = โทนอุ่น · ปุ่ม = เขียว GO · โซน = สีหมุดบนผัง) ── */
:root,[data-theme="dark"]{color-scheme:dark;
  --bg:#15122b;--bg2:#100d22;--card:#211c45;--card2:#2a2456;--line:rgba(255,255,255,.12);--shadow:none;
  --head:#ffffff;--ink:#f1eef8;--sub:#c9c3df;
  --acc:#84e62d;--acc-ink:#15122b;--link:#a6f06a;
  --price:#ffcf6b;--kick-bg:rgba(255,207,107,.16);--kick:#ffcf6b;
  --food:#ff8a3d;--food-ink:#1d0f05;--boot:#b48cf0;--boot-ink:#1c1238;--court:#2cc9b5;--court-ink:#06231f;
  --ok-bg:rgba(132,230,45,.14);--ok:#c8f5a0;--no-bg:rgba(255,122,122,.14);--no:#ffb3b3;
  --hero:radial-gradient(90% 120% at 85% 0%,#4a2f8a 0%,#15122b 62%);--wm-ink:#fff;--wm-go:#84e62d;
  --info-bg:#84e62d;--info-ink:#1d3a0c;--info-head:#15122b}
[data-theme="light"]{color-scheme:light;
  --bg:#f6f4fb;--bg2:#ffffff;--card:#ffffff;--card2:#f1eef9;--line:rgba(21,18,43,.10);--shadow:0 6px 24px rgba(21,18,43,.07);
  --head:#15122b;--ink:#2a2640;--sub:#565070;
  --acc:#84e62d;--acc-ink:#15122b;--link:#2f7a0f;
  --price:#b45309;--kick-bg:#fff1d6;--kick:#9a5b00;
  --food:#ff8a3d;--food-ink:#2a1205;--boot:#7b4fd0;--boot-ink:#ffffff;--court:#14a08e;--court-ink:#ffffff;
  --ok-bg:#e9f9dc;--ok:#2f6b12;--no-bg:#ffe5e5;--no:#b42318;
  --hero:radial-gradient(90% 120% at 85% 0%,#e3d8ff 0%,#f6f4fb 62%);--wm-ink:#15122b;--wm-go:#3f9a12;
  --info-bg:#15122b;--info-ink:#cfcbe6;--info-head:#ffffff}

*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font-family:"Prompt",sans-serif;font-size:16px;line-height:1.65;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
.w{display:inline-block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.i{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.22em;flex:none}
.i svg{width:100%;height:100%;display:block}
.brand{display:block;height:28px}
.brand svg{height:100%;width:auto;display:block}

/* ปุ่ม */
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:16px;border:2px solid transparent;transition:transform .2s,filter .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.alt{border-color:var(--line);background:var(--card);color:var(--head)}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.off{opacity:.45;pointer-events:none}

/* หัวข้อส่วน */
.sec{padding:88px 0 0;scroll-margin-top:70px}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:5px 14px;border-radius:999px;background:var(--kick-bg);color:var(--kick)}
.h2{font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.25;color:var(--head);margin-top:12px}
.h2 .br{color:var(--link)}
.lead{font-size:17px;color:var(--sub);margin-top:8px;max-width:62ch}
.tabs{display:inline-flex;gap:4px;padding:4px;margin-top:22px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.tabs button{padding:8px 20px;border:0;border-radius:999px;background:none;font-weight:600;font-size:15px;color:var(--sub);cursor:pointer;transition:background .2s,color .2s}
.tabs button.on{background:var(--head);color:var(--bg)}

/* ── แถบบน ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:26px;height:68px}
.top nav{display:flex;gap:22px;margin-left:auto;font-size:15px;font-weight:500;color:var(--head)}
.top nav a{opacity:.85;transition:opacity .2s,color .2s}
.top nav a:hover{opacity:1;color:var(--link)}
.theme{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--head);cursor:pointer}
.theme .i{width:20px;height:20px}
.theme .sun{display:none}[data-theme="dark"] .theme .sun{display:block}[data-theme="dark"] .theme .moon{display:none}

/* ── หัวหน้า ── */
.hero{background:var(--hero);padding:64px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-weight:700;font-size:clamp(40px,6vw,72px);line-height:1.12;color:var(--head);margin-top:16px}
.hero h1 em{font-style:normal;color:var(--link);white-space:nowrap}
.hero .sub{font-size:19px;color:var(--sub);margin-top:16px;max-width:40ch}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.shot{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/3.4;background:var(--card);box-shadow:0 30px 70px rgba(10,8,30,.35)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot figcaption{position:absolute;left:14px;bottom:14px;padding:5px 12px;border-radius:999px;background:rgba(16,13,34,.75);color:#fff;font-size:13px}
.status{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;color:#15122b;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.status i{width:9px;height:9px;border-radius:50%;background:#a19bb3}
.status.open i{background:#3fbf1a;box-shadow:0 0 0 4px rgba(63,191,26,.25)}

/* ตัวเลขเด่น */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-36px;position:relative}
.stat{padding:20px 22px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat b{display:block;font-size:34px;font-weight:700;line-height:1.1;color:var(--price)}
.stat span{display:block;font-size:14px;color:var(--sub);margin-top:4px}

/* ── สาขา ── */
.branches{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.br-card{border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.br-card .ph{height:220px;background:var(--card2) center/cover no-repeat;position:relative}
.br-card .ph.none{display:grid;place-items:center;background:radial-gradient(100% 120% at 80% 0%,#4a2f8a,#211c45)}
.br-card .ph.none span{font-size:15px;color:#d8d2ee;font-weight:500}
.br-card .bd{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.br-card h3{font-size:28px;font-weight:700;color:var(--head);line-height:1.2}
.br-card .tag{display:inline-block;font-size:13px;font-weight:600;color:var(--link)}
.br-card .where{font-size:15px;color:var(--sub)}
.hours{display:flex;flex-wrap:wrap;gap:8px}
.hours span{padding:6px 12px;border-radius:12px;background:var(--card2);font-size:14px;color:var(--sub)}
.hours b{color:var(--head);font-weight:600}
.br-card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}

/* ── ลิงก์ด่วน ── */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:24px}
.q{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.q:hover{transform:translateY(-3px);border-color:var(--acc)}
.q>.i{width:46px;height:46px;padding:11px;border-radius:14px;background:var(--ok-bg);color:var(--link)}
.q b{display:block;font-size:17px;font-weight:600;color:var(--head);line-height:1.3}
.q small{display:block;font-size:14px;color:var(--sub);line-height:1.45}
.q .arr{margin-left:auto;color:var(--sub)}
.q.main{background:var(--acc);border-color:var(--acc)}
.q.main b,.q.main .arr{color:var(--acc-ink)}.q.main small{color:#2c4a12}
.q.main>.i{background:rgba(21,18,43,.12);color:var(--acc-ink)}
.q.off{opacity:.5;pointer-events:none}

/* ── ผู้ค้า: โซน ราคา ── */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:24px}
.zone{border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.zt{display:flex;align-items:center;gap:10px;padding:16px 22px;font-weight:700;font-size:20px;background:var(--zc);color:var(--zi)}
.zt small{margin-left:auto;font-size:13px;font-weight:500}
.z-food{--zc:var(--food);--zi:var(--food-ink)}.z-boot{--zc:var(--boot);--zi:var(--boot-ink)}.z-court{--zc:var(--court);--zi:var(--court-ink)}
.zb{padding:8px 22px 20px}
.zb .rule{font-size:15px;color:var(--sub);padding:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;font-weight:500;padding:3px 11px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--no-bg);color:var(--no)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:12px}
.season{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:600;color:var(--head)}
.season .now{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--acc);color:var(--acc-ink)}
.sea.dim .season{color:var(--sub);font-weight:500}
.pr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.pr>span{font-size:16px;font-weight:500;color:var(--ink)}
.pr .today{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--acc);color:var(--acc-ink);vertical-align:middle}
.pr b{font-size:32px;font-weight:700;line-height:1;color:var(--price)}
.pr b small{font-size:14px;font-weight:500;color:var(--sub);margin-left:4px}
.pr em{display:block;font-style:normal;font-size:13px;color:var(--sub);text-align:right;margin-top:4px}
.sea.dim .pr b{font-size:24px;opacity:.8}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.fact{padding:10px 12px;border-radius:12px;background:var(--card2)}
.fact small{display:block;font-size:12px;color:var(--sub)}
.fact b{font-size:14px;font-weight:600;color:var(--head)}
.note{font-size:14px;color:var(--sub);margin-top:12px}

/* ขั้นตอน */
.steps{list-style:none;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.steps li{counter-increment:s;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:18px;margin-bottom:12px}
.steps b{display:block;font-size:17px;font-weight:600;color:var(--head);line-height:1.35}
.steps li>span{display:block;font-size:14px;color:var(--sub);margin-top:4px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* ── เช่าลาน ── */
.event{display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;margin-top:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.event .ph{min-height:380px;background:center/cover no-repeat}
.event .bd{padding:30px}
.event .pr b{font-size:28px}

/* ── ผัง 3D ── */
.mapbox{position:relative;margin-top:24px;height:min(76vh,720px);border-radius:26px;overflow:hidden;background:#100d24;border:1px solid var(--line)}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapbox .cover{position:absolute;inset:0;display:grid;place-items:center;width:100%;border:0;background:rgba(16,13,34,.5);cursor:pointer}
.mapbox .cover span{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.mapbox.live .cover{display:none}

/* ── ติดต่อ + ท้ายหน้า ── */
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px;padding:28px;border-radius:24px;background:var(--info-bg);color:var(--info-ink)}
.info h4{font-size:18px;font-weight:600;color:var(--info-head)}
.info .tel{display:block;font-size:30px;font-weight:700;color:var(--info-head);margin-top:6px;line-height:1.2}
.info p{font-size:14px;margin-top:2px}
.info .ln{display:inline-block;margin-top:8px;margin-right:12px;font-size:14px;font-weight:600;color:var(--info-head);text-decoration:underline;text-underline-offset:3px}
footer{margin-top:88px;padding:36px 0 44px;background:var(--bg2);border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px;align-items:center}
footer .fine{flex-basis:100%;font-size:13px}

/* เลื่อนแล้วค่อยโผล่ */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){ .rv{opacity:1;transform:none;transition:none} }

@media (max-width:900px){
  .wrap{padding:0 20px}
  .top nav{display:none}.top .wrap{gap:12px}.top .theme{margin-left:auto}
  .hero{padding:40px 0 64px}.hero .wrap{grid-template-columns:1fr;gap:32px}
  .stats{grid-template-columns:1fr 1fr}
  .branches,.event{grid-template-columns:1fr}
  .event .ph{min-height:240px}
  .steps{grid-template-columns:1fr 1fr}
  .info{grid-template-columns:1fr}
}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .brand{height:22px}.top .btn{padding:8px 14px;font-size:13px}
  .sec{padding-top:64px}
  .stats{gap:10px}.stat{padding:16px}.stat b{font-size:26px}
  .zones{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .tabs button{padding:8px 14px}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <a class="brand" data-wm href="#" aria-label="ตลาดเซฟวัน GO"></a>
  <nav><a href="#branches">สาขา</a><a href="#visit">มาเดินตลาด</a><a href="#sell">มาขายของ</a><a href="#map">ผังตลาด</a><a href="#contact">ติดต่อ</a></nav>
  <button class="theme" id="themeBtn" title="สลับธีมสว่าง/มืด" aria-label="สลับธีมสว่าง/มืด">
    <i class="i sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></i>
    <i class="i moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></i>
  </button>
  <a class="btn pri sm" id="topBook" href="#sell">จองล็อก</a>
</div></header>

<main id="main"></main>
<footer id="foot"></footer>

<script src="content/cms.js?v=20261028i"></script>
<script>
const { esc, get, phr } = CMS;
const $ = id => document.getElementById(id);
// ไอคอนวาดเอง (ชุดเดียวกับ home.html) · ไม่ใช้อีโมจิ
const ICON = {
  bag: '<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  store: '<path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/><path d="M3 9a3 3 0 0 0 6 0a3 3 0 0 0 6 0a3 3 0 0 0 6 0"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',
  parking: '<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 17V7h3.5a3 3 0 0 1 0 6H10"/>',
  cam: '<rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10.5l5-3v9l-5-3"/>',
  chat: '<path d="M4 5h16v11H10l-6 4z"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  pin: '<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  food: '<path d="M4 20L20 4"/><circle cx="9" cy="15" r="2.4"/><circle cx="12.5" cy="11.5" r="2.4"/><circle cx="16" cy="8" r="2.4"/>',
  car: '<path d="M3 16v-4l2.5-5h13l2.5 5v4z"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  size: '<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
  bolt: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
  online: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  walk: '<path d="M4 21V5l8-2v18"/><path d="M12 9h8v12"/><path d="M3 21h18"/>',
  box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  arrow: '<path d="M7 17L17 7M9 7h8v8"/>',
  next: '<path d="M4 12h16M14 6l6 6-6 6"/>',
  map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
};
const ic = k => `<i class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k] || ''}</svg></i>`;
const digits = s => String(s || '').replace(/[^\d+]/g, '');
const lineUrl = id => 'https://line.me/R/ti/p/' + encodeURIComponent(String(id || '').trim());
const ext = h => /^https?:/.test(h) ? ' target="_blank" rel="noopener"' : '';
const nums = s => String(s || '').match(/\d[\d,]*/g)?.map(n => +n.replace(/,/g, '')) || [];
const filled = v => Array.isArray(v) ? v.some(filled) : typeof v === 'string' && v.trim() !== '';
let C, CB = 'sg', VB = 'sg';   // สาขาที่ดูในส่วน มาเดินตลาด / มาขายของ

// ตอนนี้ตลาดเปิดไหม (เวลาเครื่อง เทียบ "16:00–23:00")
function status(hours) {
  const [o, c] = hours.split('–').map(t => { const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); });
  const d = new Date(), n = d.getHours() * 60 + d.getMinutes(), open = n >= o && n < c, m = ((o - n) + 1440) % 1440;
  return { open, text: open ? `ตอนนี้เปิดอยู่ · ถึง ${hours.split('–')[1]}` : `เปิดอีก ${m >= 60 ? Math.floor(m / 60) + ' ชม. ' : ''}${m % 60 ? (m % 60) + ' นาที' : ''}` };
}
const zonesOf = k => Object.entries(C[k].vendor.zones).filter(([, Z]) => Z.rows.some(r => nums(r.online).length));
const photos = k => (C[k].customer.photos || []).filter(([s]) => s);

function render() {
  const sg = C.sg, ko = C.korat, hours = sg.facts[0]?.[2] || '16:00–23:00';
  const hero = photos('korat')[0] || ['', ''], st = status(hours);
  const minSg = Math.min(...zonesOf('sg').flatMap(([, Z]) => Z.rows.flatMap(r => nums(r.online))));
  const tabs = id => `<div class="tabs" id="${id}">${C.branchKeys.map(k => `<button data-b="${k}">${esc(C[k].name)}</button>`).join('')}</div>`;
  const brCard = k => { const b = C[k], ph = photos(k)[0], map = get(C, `${k}.links.map`);
    return `<article class="br-card rv"><div class="ph${ph ? '' : ' none'}"${ph ? ` style="background-image:url('${esc(ph[0])}')"` : ''}>${ph ? '' : '<span>รอรูปสาขา</span>'}</div>
      <div class="bd"><span class="tag">${esc(b.tag)}</span><h3>${esc(b.name)}</h3><p class="where">${phr(b.where)}</p>
      <div class="hours">${b.facts.map(f => `<span>${esc(f[1])} <b>${esc(f[2])}</b></span>`).join('')}</div>
      <div class="acts">${map ? `<a class="btn pri sm" href="${esc(map)}"${ext(map)}>${ic('pin')} นำทาง</a>` : ''}<a class="btn alt sm" href="tel:${digits(b.contact.phone)}">${ic('phone')} ${esc(b.contact.phone)}</a><a class="btn alt sm" href="${esc(lineUrl(b.contact.lineCustomer))}" target="_blank" rel="noopener">LINE ${esc(b.contact.lineCustomer)}</a></div></div></article>`; };
  const ev = ko.vendor.event, evPh = ev.photos.find(([s]) => s)?.[0];

  $('main').innerHTML = `
  <section class="hero"><div class="wrap">
    <div><span class="kick">${ic('clock')} เปิดทุกวัน ${esc(hours)}</span>
      <h1>ตลาดเย็น <em>เซฟวัน โก</em></h1>
      <p class="sub">${C.branchKeys.length} สาขา: ${C.branchKeys.map(k => esc(C[k].name)).join(' · ')} — มาเดินเล่นหาของกิน หรือมาเป็นผู้ค้า ไม่มีค่าเซ้ง</p>
      <div class="btns"><a class="btn pri" href="#visit">${ic('bag')} ${esc(C.gate.cus.title)}</a><a class="btn alt" href="#sell">${ic('store')} ${esc(C.gate.ven.title)}</a></div></div>
    <figure class="shot"><img src="${esc(hero[0])}" alt="${esc(hero[1])}"><span class="status${st.open ? ' open' : ''}"><i></i>${esc(st.text)} <small style="font-weight:500;color:#565070">(${esc(sg.name)})</small></span><figcaption>${esc(hero[1])}</figcaption></figure>
  </div></section>

  <div class="wrap"><div class="stats">
    <div class="stat rv"><b>${C.branchKeys.length} สาขา</b><span>${C.branchKeys.map(k => esc(C[k].name)).join(' · ')}</span></div>
    <div class="stat rv"><b>${esc(hours.split('–')[0])}</b><span>เปิดทุกวัน ถึง ${esc(hours.split('–')[1])}</span></div>
    <div class="stat rv"><b>${minSg} บาท</b><span>ค่าล็อกเริ่มต้น/วัน (${esc(sg.name)})</span></div>
    <div class="stat rv"><b>0 บาท</b><span>ค่าเซ้ง · ไม่มีล็อกประจำ</span></div>
  </div></div>

  <section class="sec" id="branches"><div class="wrap">
    <span class="kick">${ic('pin')} สาขา</span><h2 class="h2">เลือกสาขาที่ใกล้คุณ</h2>
    <div class="branches">${C.branchKeys.map(brCard).join('')}</div>
  </div></section>

  <section class="sec" id="visit"><div class="wrap">
    <span class="kick">${ic('bag')} ${esc(C.gate.cus.title)}</span><h2 class="h2">มาเดินตลาด <span class="br" id="cName"></span></h2>
    <p class="lead" id="cSub"></p>${tabs('cTabs')}<div class="quick" id="cQuick"></div><p class="note" id="cNote"></p>
  </div></section>

  <section class="sec" id="sell"><div class="wrap">
    <span class="kick">${ic('store')} ${esc(C.gate.ven.title)}</span><h2 class="h2">ราคาค่าล็อก <span class="br" id="vName"></span></h2>
    <p class="lead" id="vSub"></p>${tabs('vTabs')}
    <div class="zones" id="vZones"></div><p class="note" id="vNote"></p>
    <h2 class="h2" style="margin-top:56px;font-size:clamp(24px,3vw,32px)">เริ่มขายใน <span id="vN"></span> ขั้น</h2>
    <ol class="steps" id="vSteps"></ol><p class="note" id="vStepNote"></p>
    <div class="cta" id="vCta"></div>
  </div></section>

  ${evPh ? `<section class="sec"><div class="wrap"><span class="kick">${ic('map')} ${esc(ev.title)}</span><h2 class="h2">${esc(ev.title)} <span class="br">· ${esc(ko.name)}</span></h2>
    <div class="event rv"><div class="ph" style="background-image:url('${esc(evPh)}')"></div><div class="bd">
      <p class="lead" style="margin-top:0;color:var(--ink)">${phr(ev.sub)}</p>
      ${ev.rows.map(([a, p]) => `<div class="pr"><span>${esc(a)}</span><b>${esc(p)}<small>บาท</small></b></div>`).join('')}
      <p class="note">${phr(ev.areas)} · ${phr(ev.note)}</p>
      <div class="cta"><a class="btn pri" href="tel:${digits(ev.tel)}">${ic('phone')} สอบถาม ${esc(ev.tel)}</a></div></div></div></div></section>` : ''}

  <section class="sec" id="map"><div class="wrap">
    <span class="kick">${ic('map')} ผังตลาด</span><h2 class="h2">ผังตลาด 3D</h2><p class="lead">แตะหมุดเพื่อดูโซน ที่จอดรถ และจุดบริการ · เปลี่ยนสาขาได้ที่ลูกศรด้านล่างผัง</p>
    <div class="mapbox" id="mapbox"><button class="cover" id="mapCover"><span>${ic('map')} แตะเพื่อเปิดผัง 3D</span></button></div>
  </div></section>

  <section class="sec" id="contact"><div class="wrap">
    <span class="kick">${ic('phone')} ติดต่อ</span><h2 class="h2">ติดต่อตลาด</h2>
    <div class="info">${C.branchKeys.map(k => { const c = C[k].contact, same = c.lineCustomer === c.lineVendor;
      return `<div><h4>สาขา${esc(C[k].name)}</h4><a class="tel" href="tel:${digits(c.phone)}">${esc(c.phone)}</a><p>โทร ${esc(c.phoneHours)}</p>
        <a class="ln" href="${esc(lineUrl(c.lineVendor))}" target="_blank" rel="noopener">${same ? 'LINE' : 'ผู้ค้า'} ${esc(c.lineVendor)}</a>${same ? '' : `<a class="ln" href="${esc(lineUrl(c.lineCustomer))}" target="_blank" rel="noopener">ลูกค้า ${esc(c.lineCustomer)}</a>`}</div>`; }).join('')}
      <div><h4>${esc(C.contact.company)}</h4><p style="margin-top:6px">${phr(C.contact.address)}</p></div></div>
  </div></section>`;

  $('foot').innerHTML = `<div class="wrap"><span class="brand" data-wm></span><span>${esc(C.contact.company)} · ${phr(C.contact.address)}</span><p class="fine">${phr(C.contact.footnote)}</p></div>`;
  $('cTabs').onclick = e => { const b = e.target.closest('button'); if (b) { CB = b.dataset.b; visit(); } };
  $('vTabs').onclick = e => { const b = e.target.closest('button'); if (b) { VB = b.dataset.b; vendor(); } };
  $('mapCover').onclick = () => {
    const f = document.createElement('iframe'); f.title = 'ผังตลาด 3D'; f.src = 'branch-flip.html?v=20261029a';
    f.onload = () => { try { f.contentWindow.postMessage({ pinGroup: null, content: C }, location.origin); } catch {} };
    $('mapbox').prepend(f); $('mapbox').classList.add('live');
  };
  visit(); vendor(); fillWordmarks(); reveal();
}

// มาเดินตลาด: ลิงก์ด่วนของสาขา (ปุ่มที่ยังไม่มีลิงก์ = จาง "รอลิงก์")
function visit() {
  const b = C[CB], val = (kind, key) => get(C, `${CB}.${kind}.${key}`) || get(C, `${kind}.${key}`) || '';
  document.querySelectorAll('#cTabs button').forEach(x => x.classList.toggle('on', x.dataset.b === CB));
  $('cName').textContent = '· ' + b.name;
  $('cSub').innerHTML = phr(b.customer.sub);
  const href = q => q.tel ? (val('contact', q.tel) && 'tel:' + digits(val('contact', q.tel))) : q.line ? (val('contact', q.line) && lineUrl(val('contact', q.line))) : q.link ? val('links', q.link) : q.href || '';
  $('cQuick').innerHTML = b.customer.quick.map(q => { const h = href(q);
    return `<a class="q${q.main ? ' main' : ''}${h ? '' : ' off'}" href="${esc(h || '#')}"${ext(h)}>${ic(q.ic)}<div><b>${esc(q.title)}</b><small>${phr(q.sub)}${h ? '' : ' · รอลิงก์'}</small></div><span class="arr">${ic(ext(h) ? 'arrow' : 'next')}</span></a>`; }).join('');
  $('cNote').innerHTML = phr(b.customer.note || '');
}

// มาขายของ: ทุกโซนของสาขา · ราคาแยกฤดู (ถ้ามี) · ไฮไลต์ฤดู/วันนี้
function vendor() {
  const b = C[VB], V = b.vendor, now = CMS.seasonNow(V.seasons), dow = CMS.dowNow();
  document.querySelectorAll('#vTabs button').forEach(x => x.classList.toggle('on', x.dataset.b === VB));
  $('vName').textContent = '· ' + b.name;
  $('vSub').innerHTML = phr(V.sub);
  const zone = ([z, Z]) => { const R = C.vendor.rules[z] || {};
    const groups = [...new Set(Z.rows.map(r => r.season))].sort((x, y) => (y === now) - (x === now));   // '' = ราคาเดียวทั้งปี · ฤดูปัจจุบันขึ้นก่อน
    const rows = s => Z.rows.filter(r => r.season === s && r.online).map(r => { const today = (!s || s === now) && r.dow === dow;
      return `<div class="pr"><span>${esc(r.days)}${today ? '<span class="today">วันนี้</span>' : ''}</span><div><b>${esc(r.online)}<small>บาท</small></b>${r.walkin ? `<em>Walk-in ${esc(r.walkin)}</em>` : ''}</div></div>`; }).join('');
    const prices = groups.map(s => `<div class="sea${s && s !== now ? ' dim' : ''}"><p class="season">${s ? esc(get(V.seasons, s + '.label') || s) + (s === now ? ' <span class="now">ช่วงนี้</span>' : '') : 'ราคาเดียวทั้งปี'}</p>${rows(s)}</div>`).join('');
    const facts = Z.facts.filter(f => f[0] && f[0] !== 'size' && filled(f[2]));
    return `<div class="zone z-${z} rv"><div class="zt">${ic(R.ic || Z.ic)} ${esc(Z.name)}<small>${esc(Z.facts.find(f => f[0] === 'size')?.[2]?.split(' · ')[0] || '')}</small></div><div class="zb">
      <p class="rule">${phr(R.sub || '')}</p>
      ${filled(R.ok) ? `<span class="lbl">ขายได้</span><div class="chips">${R.ok.filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
      ${filled(R.no) ? `<span class="lbl">ห้ามขาย</span><div class="chips">${R.no.filter(Boolean).map(t => `<span class="chip no">${esc(t)}</span>`).join('')}</div>` : ''}
      ${prices}
      <div class="facts">${facts.map(f => `<div class="fact"><small>${esc(f[1])}</small><b>${phr(f[2])}</b></div>`).join('')}</div></div></div>`; };
  $('vZones').innerHTML = zonesOf(VB).map(zone).join('');
  $('vNote').innerHTML = 'ราคาจองออนไลน์ บาท/ล็อก/วัน · ' + phr(V.scope);
  const steps = V.steps.items.filter(([t]) => t);
  $('vN').textContent = steps.length;
  $('vSteps').innerHTML = steps.map(([t, s]) => `<li><b>${phr(t)}</b><span>${phr(s)}</span></li>`).join('');
  $('vStepNote').innerHTML = phr(V.steps.note || '');
  const book = get(C, `${VB}.links.booking`);
  $('vCta').innerHTML = (book ? `<a class="btn pri" href="${esc(book)}" target="_blank" rel="noopener">${ic('online')} จองล็อก</a>` : '')
    + `<a class="btn alt" href="${esc(lineUrl(b.contact.lineVendor))}" target="_blank" rel="noopener">${ic('chat')} LINE ผู้ค้า ${esc(b.contact.lineVendor)}</a><a class="btn alt" href="home.html">กฎ · การลา · คะแนน</a>`;
  $('topBook').href = book || '#sell';
  if (book) { $('topBook').target = '_blank'; $('topBook').rel = 'noopener'; } else { $('topBook').removeAttribute('target'); }
  reveal();
}

let WM = null;
async function fillWordmarks() {
  try { WM = WM || await (await fetch('img/wordmark.svg')).text(); } catch { return; }
  document.querySelectorAll('[data-wm]').forEach(el => { if (!el.firstChild) el.innerHTML = WM; });
}
let io;
function reveal() {
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));
}
$('themeBtn').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
};
CMS.load().then(c => { C = c; render(); }).catch(e => { $('main').innerHTML = `<p class="wrap sec">โหลดข้อมูลไม่ได้: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
