<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตลาดเซฟวัน โก · ไนท์มาร์เก็ต</title>
<!-- แบบที่ 3 "A+D" (เจ้าของเลือก 30 ต.ค. 69): รูปค้างจอเล่าทีละสาขา (A) → หน้าปุ่มใหญ่แบบแอป (D) · ซ่อนแถบเลื่อน
     ข้อความเล่าเรื่อง = site.json → story · เวลา/ราคา/ลิงก์ = content/<สาขา>/data.json · สาขา GO ขึ้นก่อน (siteKeys)
     รูปโคราชใช้เฉพาะช่วงโคราช (Saveone Market แยกบริษัท) -->
<script>{ let t; try { t = localStorage.getItem('theme'); } catch {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b/style.css?v=20261031p">
<style>
/* ซ่อนแถบเลื่อน (เจ้าของสั่ง) · ยังเลื่อนด้วยล้อเมาส์/นิ้ว/คีย์บอร์ดได้ปกติ */
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}

/* ── A รูปค้างจอ ── ช่วงนี้มืดเสมอทั้ง 2 ธีม (ตัวหนังสือบนรูป) → ใช้สีตายตัว */
.A{height:calc(var(--n) * 100svh);position:relative;background:#15122b}
.A .stage{position:sticky;top:0;height:100svh;overflow:hidden}
.A .ph{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transform:scale(1.12);transition:opacity .7s,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.A .ph.on{opacity:1;transform:scale(1)}
.A .ph.logo{background:radial-gradient(70% 70% at 70% 40%,#4a2f8a 0%,#15122b 70%)}
.A .ph.logo img{position:absolute;right:var(--gut);top:50%;width:min(52%,760px);transform:translateY(-50%)}
.A .ph.none{background:radial-gradient(80% 90% at 80% 10%,#3d2878 0%,#15122b 65%)}
.A .ph.none>span{position:absolute;right:var(--gut);top:130px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#c9c3df;font-size:14px}
.A .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(21,18,43,.92) 0%,rgba(21,18,43,.55) 45%,rgba(21,18,43,0) 75%)}
.A{--gut:max(32px,calc((100vw - 1180px) / 2 + 32px))}
.A .bar{position:absolute;left:var(--gut);right:var(--gut);top:24px;display:flex;align-items:center;gap:12px;z-index:3;--wm-ink:#fff;--wm-go:#84e62d}
.A .bar .brand{height:30px;transition:opacity .4s}.A .stage[data-s="0"] .bar .brand{opacity:0}
.A .dots{display:flex;gap:6px;margin-left:auto}
.A .x{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(21,18,43,.5);color:#fff;font-size:14px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.A .x:hover{background:rgba(255,255,255,.15)}.A .x svg{width:16px;height:16px}
.A .dots i{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);transition:background .3s}.A .dots i.on{background:#84e62d}
.A .txt{position:absolute;left:var(--gut);bottom:96px;width:min(560px,calc(100% - 64px));z-index:3}
.A .step{position:absolute;bottom:0;left:0;right:0;opacity:0;transform:translateY(30px);transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.A .step.on{opacity:1;transform:none;pointer-events:auto}
.A .step .k{display:inline-block;color:#ffcf6b;font-weight:600;font-size:15px}
.A .step .k b.go{background:rgba(132,230,45,.18);color:#c8f5a0}
.A .step .k b{margin-left:8px;padding:2px 10px;border-radius:999px;background:rgba(44,201,181,.18);color:#7ff0df;font-weight:600}
.A .step h1,.A .step h2{font-size:clamp(36px,5.4vw,64px);line-height:1.12;font-weight:700;color:#fff;margin-top:6px}
.A .step h2 em{font-style:normal;color:#ffcf6b}
.A .step p{color:#d9d4ec;font-size:18px;margin-top:10px}
.A .step .hrs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.A .step .hrs>span{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#f1eef8;font-size:15px}
.A .step .hrs b{color:#ffcf6b;font-weight:600}
.A .cap{position:absolute;right:var(--gut);bottom:22px;z-index:3;color:rgba(255,255,255,.7);font-size:13px;opacity:0;transition:opacity .5s}.A .cap.on{opacity:1}
.A .skip{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:4;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(6px)}
.A .skip .i{transform:rotate(90deg)}

/* ── หน้าเปิดทดลอง ?op=1|2|3 (31 ต.ค. 69 เจ้าของว่าโลโก้ 3D ดูแปลก + ที่ว่างเยอะ) · ไม่มี ?op = แบบเดิม ── */
.A.op1 .stage .bar .brand,.A.op3 .stage .bar .brand{opacity:1}
/* 1 ภาพผังเต็มจอ: เปิดมาซูมใกล้ → เลื่อนถึงสาขาแรก = ภาพเดียวกันแต่ถอยออกทั้งผัง */
.A .ph.op1{background:url(img/sg-3d-preview.jpg) 22% 30%/cover no-repeat;transform:scale(1.9);transform-origin:20% 26%}
.A .ph.op1.on{transform:scale(1.45);transition:opacity .7s,transform 9s cubic-bezier(.2,.7,.2,1)}
.A .ph.op1::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 70% 40%,rgba(21,18,43,0),rgba(21,18,43,.55))}
/* 2 โลโก้แบนคมๆ กลางจอ + ไฟตลาดระยิบ */
.A .ph.op2{background:radial-gradient(70% 60% at 50% 45%,#3d2878 0%,#15122b 72%)}
.A .ph.op2 .lights{position:absolute;inset:-10%;background:
  radial-gradient(circle at 12% 22%,rgba(255,207,107,.55) 0 3px,transparent 4px),radial-gradient(circle at 24% 70%,rgba(255,138,61,.5) 0 4px,transparent 5px),
  radial-gradient(circle at 38% 14%,rgba(132,230,45,.45) 0 3px,transparent 4px),radial-gradient(circle at 63% 82%,rgba(255,207,107,.5) 0 5px,transparent 6px),
  radial-gradient(circle at 78% 18%,rgba(180,140,240,.6) 0 4px,transparent 5px),radial-gradient(circle at 88% 60%,rgba(255,207,107,.45) 0 3px,transparent 4px),
  radial-gradient(circle at 52% 30%,rgba(255,255,255,.35) 0 2px,transparent 3px),radial-gradient(circle at 7% 52%,rgba(180,140,240,.5) 0 5px,transparent 6px),
  radial-gradient(circle at 93% 88%,rgba(132,230,45,.4) 0 4px,transparent 5px),radial-gradient(circle at 32% 92%,rgba(255,255,255,.3) 0 2px,transparent 3px);
  filter:blur(1.5px);animation:twinkle 6s ease-in-out infinite alternate}
.A .ph.op2 .lights+.lights{inset:-20%;transform:rotate(180deg) scale(1.3);filter:blur(5px);opacity:.7;animation-delay:-3s}
@keyframes twinkle{from{opacity:.55;translate:0 0}to{opacity:1;translate:0 -18px}}
.A .ph.op2 .mid{position:absolute;left:50%;top:46%;width:min(88%,860px);transform:translate(-50%,-50%);text-align:center;--wm-ink:#fff;--wm-go:#84e62d}
.A .ph.op2 .mid .k{color:#ffcf6b;font-weight:600;font-size:clamp(15px,1.6vw,20px)}
.A .ph.op2 .mid [data-wm]{display:block;margin:18px auto 22px;filter:drop-shadow(0 10px 40px rgba(132,230,45,.25))}
.A .ph.op2 .mid [data-wm] svg{width:100%;height:auto;display:block}
.A .ph.op2 .mid p{color:#d9d4ec;font-size:clamp(16px,1.7vw,20px);line-height:1.6}
/* 3 ข้อความซ้าย + การ์ดผัง 3D เอียงด้านขวา + ป้ายลอย */
.A .ph.op3{background:radial-gradient(70% 70% at 72% 42%,#4a2f8a 0%,#15122b 70%)}
.A .ph.op3 .card{position:absolute;right:var(--gut);top:50%;width:min(56%,720px);transform:translateY(-54%) perspective(1400px) rotateY(-14deg) rotateX(5deg);border-radius:24px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12),0 0 80px rgba(132,230,45,.15)}
.A .ph.op3 .card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:35% 50%}
.A .ph.op3 .chip{position:absolute;padding:10px 16px;border-radius:16px;background:rgba(21,18,43,.88);border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:15px;box-shadow:0 14px 34px rgba(0,0,0,.4);backdrop-filter:blur(8px);animation:bob 4s ease-in-out infinite alternate}
.A .ph.op3 .chip b{color:#ffcf6b}.A .ph.op3 .chip.g b{color:#84e62d}
.A .ph.op3 .c1{right:calc(var(--gut) + min(46%,600px));top:24%}.A .ph.op3 .c2{right:calc(var(--gut) - 8px);bottom:20%;animation-delay:-2s}
@keyframes bob{from{translate:0 0}to{translate:0 -10px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.A.op2 .shade,.A.op3 .stage[data-s="0"] .shade{opacity:0}.A .shade{transition:opacity .6s}

/* ── D แบบแอป ── ตามธีม */
.D{position:relative;min-height:100svh;display:flex;flex-direction:column;background:var(--hero)}
.D .panel{width:100%;max-width:980px;margin:0 auto;padding:0 32px}
.D .hd{padding-top:28px;display:flex;align-items:center;gap:12px}
.D .topnav{display:none}
.D .open{margin-left:auto;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;background:var(--card);color:var(--head);border:1px solid var(--line)}
.D .open i{width:8px;height:8px;border-radius:50%;background:#a19bb3}.D .open.on i{background:#3fbf1a}
.D .theme{flex:none}
.D h2{padding-top:26px;font-size:clamp(30px,4vw,42px);line-height:1.2;color:var(--head);font-weight:700}
.D .seg{display:flex;gap:4px;margin-top:18px;padding:4px;border-radius:999px;background:var(--card2)}
.D .seg button{flex:1;padding:10px 6px;border:0;border-radius:999px;background:none;color:var(--sub);font-weight:600;font-size:15px;cursor:pointer;transition:background .2s,color .2s}
.D .seg button.on{background:var(--head);color:var(--bg)}
.D .who{display:flex;gap:10px;margin-top:14px}
.D .who button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--head);font-weight:600;font-size:16px;cursor:pointer}
.D .who button.on{border-color:var(--acc);background:var(--ok-bg)}
.D .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:18px;padding-bottom:40px}
.D .tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:20px;min-height:140px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--head);
  opacity:0;transform:translateY(24px) scale(.96);transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1.2),border-color .2s}
.D .tile.in{opacity:1;transform:none}
.D .tile:active{transform:scale(.97)}
.D .tile:hover{border-color:var(--acc)}
.D .tile>.i{width:44px;height:44px;padding:10px;border-radius:14px;background:var(--ok-bg);color:var(--link)}
.D .tile b{font-size:18px;line-height:1.3}
.D .tile small{color:var(--sub);font-size:14px;line-height:1.45}
.D .tile.big{grid-column:span 2;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.D .tile.big>.i{background:rgba(21,18,43,.12);color:var(--acc-ink)}.D .tile.big small{color:#2c4a12}
.D .tiles>.tile:last-child:nth-child(even){grid-column:span 2}
.D .tile .p{position:absolute;right:18px;top:18px;color:var(--price);font-weight:700;font-size:15px}
.D .tile .p.on{color:var(--acc-ink)}
/* โคราช = Saveone Market (คนละบริษัท) → หัวเว็บใช้โลโก้รถกระบะ แทนตัวหนังสือเซฟวัน GO · สีตามธีมด้วย mask */
.D .brand.mk{display:block;flex:none;width:68px;height:42px;background:var(--head);-webkit-mask:url(img/market-logo.png) center/contain no-repeat;mask:url(img/market-logo.png) center/contain no-repeat}
.D .hero3{position:relative;margin-top:22px;padding:14px 4px 22px}
.D .hero3 .card{border-radius:22px;overflow:hidden;transform:perspective(1100px) rotateX(6deg) rotateY(-9deg);box-shadow:0 28px 60px rgba(0,0,0,.4),0 0 0 1px var(--line),0 0 60px rgba(132,230,45,.12);animation:bob 5s ease-in-out infinite alternate}
.D .hero3 .card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:35% 50%}
.D .hero3 .card.none{aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(80% 90% at 70% 20%,#3d2878,#15122b 70%);color:#c9c3df;font-size:14px}
.D .hero3 .chip{position:absolute;z-index:1;padding:8px 14px;border-radius:14px;background:rgba(21,18,43,.9);border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:14px;box-shadow:0 12px 28px rgba(0,0,0,.35);backdrop-filter:blur(8px);animation:bob 4s ease-in-out infinite alternate}
.D .hero3 .chip b{color:#ffcf6b}.D .hero3 .chip.g b{color:#84e62d}
.D .hero3 .c1{left:0;top:0}.D .hero3 .c2{right:0;bottom:2px;animation-delay:-2s}
.D .more{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:28px}
.D .more a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--card2);color:var(--head);font-weight:600;font-size:15px}
.D .tab{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:clamp(8px,6vw,64px);padding:10px 8px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.D .tab a{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;font-size:13px;color:var(--sub)}
.D .tab a.on{color:var(--link)}.D .tab .i{width:24px;height:24px}
/* มือถือ/แท็บเล็ต: แถบเมนูล่างล็อกติดจอตลอด (เจ้าของ 30 ต.ค. 69) → เว้นที่ให้ช่วงรูปและท้ายเว็บไม่โดนบัง */
@media (max-width:899px){
  :root{--tabh:calc(66px + env(safe-area-inset-bottom))}
  body{padding-bottom:var(--tabh)}
  .A .stage{height:calc(100svh - var(--tabh))}
  .ver{bottom:calc(var(--tabh) + 12px)}  /* ปุ่มสลับแบบ: มุมซ้ายล่างเหมือนหน้าอื่น แค่ยกพ้นแถบเมนูล่าง */
}

@media (min-width:900px){
  /* หัวเว็บชิดบนเสมอ (เดิมทั้งก้อนจัดกลางจอ → โลโก้/เมนูลอยกลางหน้า) · คอลัมน์ซ้ายเรียงต่อกันไม่มีช่องโหว่ */
  .D .panel{max-width:1180px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto auto 1fr;grid-template-areas:"hd hd" "side tiles" "more tiles";column-gap:56px;align-content:start;flex:1;padding-bottom:48px}
  .D .hd{grid-area:hd;padding-bottom:clamp(12px,4vh,40px)}.D .side{grid-area:side}.D .more{grid-area:more;align-self:start;padding-top:22px}
  .D .tiles{grid-area:tiles;padding:26px 0 0;align-content:start}
  .D .tab{display:none}
  .D .topnav{display:flex;gap:4px;margin:0 auto}
  .D .topnav a{flex-direction:row;gap:6px;min-width:0;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink)}
  .D .topnav a:hover{background:var(--card2)}.D .topnav a.on{color:var(--link)}.D .topnav .i{width:18px;height:18px}
}
@media (max-width:720px){
  .A .shade{background:linear-gradient(0deg,rgba(21,18,43,.95) 0%,rgba(21,18,43,.6) 50%,rgba(21,18,43,.1) 100%)}
  .A{--gut:20px}
  .A .bar{top:18px}.A .bar .brand{height:24px}
  .A .txt{left:20px;width:calc(100% - 40px);bottom:84px}
  .A .step p{font-size:16px}
  .A .ph.logo img{right:auto!important;left:50%;top:30%;width:86%;transform:translate(-50%,-50%)}
  .A .ph.op2 .mid{top:40%}
  .A .ph.op3 .card{right:auto;left:50%;top:33%;width:88%;transform:translate(-50%,-50%) perspective(1000px) rotateX(8deg)}
  .A .ph.op3 .c1{right:auto;left:20px;top:calc(33% + 26vw)}.A .ph.op3 .c2{right:20px;bottom:auto;top:calc(33% + 26vw + 52px)}
  .A .ph.op3 .chip{font-size:13px;padding:8px 12px}
  .D .open{font-size:13px;padding:5px 10px}
  .A .cap{right:auto;left:var(--gut);bottom:60px;font-size:12px}
  .A .skip{left:auto;right:20px;transform:none;bottom:16px}
  .ver>span{display:none}.ver a{padding:7px 11px}  /* ปุ่มสลับแบบย่อลง ไม่ทับปุ่ม "ข้ามไปเมนู" ด้านขวา (จอ 360 ก็ยังพอ) */
  .D .panel{padding:0 18px}
  .D .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .D .tile{padding:16px;min-height:128px;border-radius:20px}
  .D .tile b{font-size:16px}.D .tile small{font-size:13px}
  .D .who button{font-size:15px;padding:12px 8px}
}
@media (prefers-reduced-motion:reduce){.A .ph,.A .step,.D .tile{transition:none}.A .ph.op3 .chip,.D .hero3 *{animation:none}}
</style>
</head>
<body>
<main id="main"></main>
<script src="content/cms.js?v=20261030a"></script>
<script src="b/parts.js?v=20261031e"></script>
<script src="b/common.js?v=20261031i"></script>
<script>
// tile ไอคอน: ใช้ ic จากไฟล์เนื้อหา · map (#map) ลิงก์ไปผังในหน้าสาขา
const tileHref = (C, k, q) => q.href === '#map' ? `branches-b.html?b=${k}#map` : quickHref(C, k, q);

page((C) => {
  const S = C.story, sg = C.sg;
  const minSg = Math.min(...zonesOf(C, 'sg').flatMap(([, Z]) => Z.rows.flatMap(r => nums(r.online))));
  const names = C.keys.map(k => esc(C[k].name)).join(' · ');
  const hrs = k => C[k].facts.filter(f => f[2] && /\d/.test(f[2])).map(f => `<span>${esc(f[1])} <b>${esc(f[2])}</b></span>`).join('');
  // ช่วงเล่าเรื่อง: [รูป, ป้ายรูป, html ข้อความ] · เปิดด้วยโลโก้ → ทีละสาขา (GO ก่อน) → มาขายกับเรา
  const OP = ['1', '2', '3'].find(o => o === new URLSearchParams(location.search).get('op')) || '3';   // หน้าเปิด = แบบ 3 การ์ดลอย (เจ้าของเลือก 31 ต.ค. 69) · ?op=1|2 ไว้เทียบ
  const hrsSg = sg.facts.find(f => f[0] === 'food')?.[2] || '';
  const goNames = C.keys.filter(k => /go/i.test(S.brand[k] || '')).map(k => esc(C[k].name)).join(' · ');
  const kick0 = `${esc(S.kick)}${hrsSg && OP !== '3' ? ` · เปิดทุกวัน ${esc(hrsSg)}` : ''}`;   // แบบ 3 มีป้ายเวลาลอยอยู่แล้ว → ไม่ซ้ำ
  const open0 = `<span class="k">${kick0}</span><h1>${esc(S.title)}</h1><p>${esc(S.sub)}<br>${goNames}</p>`;
  const steps = [
    ['logo', OP === '1' ? S.imgNote.sg || '' : '', OP === '2' ? '' : open0],
    ...C.keys.map((k, i) => {
      const ph = photos(C, k)[0], img = ph ? ph[0] : S.img[k] || '', cap = ph ? ph[1] : S.imgNote[k] || '';
      return [img, cap, `<span class="k">สาขา ${i + 1} / ${C.keys.length}${S.brand[k] ? `<b${/go/i.test(S.brand[k]) ? ' class="go"' : ''}>${esc(S.brand[k])}</b>` : ''}</span>
        <h2>${esc(C[k].name)}</h2><p>${phr(C[k].where.split(' · ').pop())}</p><div class="hrs">${hrs(k)}</div>`]; }),
    ['', '', `<span class="k">${esc(S.sell.kick)}</span><h2>ล็อกเริ่ม <em class="nb">${minSg} บาท/วัน</em></h2><p>${esc(S.sell.sub)} (ราคา${esc(sg.name)})</p>`],
  ];
  const OPEN = {
    '': `<div class="ph logo on"><img src="img/logo-3d-night.webp" alt=""></div>`,
    1: `<div class="ph op1 on"></div>`,
    2: `<div class="ph op2 on"><i class="lights"></i><i class="lights"></i><div class="mid"><span class="k">${kick0}</span><span data-wm role="img" aria-label="${esc(S.title)}"></span><h1 class="sr">${esc(S.title)}</h1><p>${esc(S.sub)}<br>${goNames}</p></div></div>`,
    3: `<div class="ph op3 on"><figure class="card"><img src="img/sg-3d-preview.jpg" alt="${esc(S.imgNote.sg || '')}"></figure>${hrsSg ? `<span class="chip c1">เปิดทุกวัน <b>${esc(hrsSg)}</b></span>` : ''}<span class="chip c2 g">ล็อกเริ่ม <b>${minSg} บาท/วัน</b></span></div>`,
  };
  const ph = ([img], i) => img === 'logo' ? OPEN[OP]
    : img ? `<div class="ph" style="background-image:url('${esc(img)}')"></div>` : `<div class="ph none">${i < steps.length - 1 ? '<span>รอรูปสาขา</span>' : ''}</div>`;
  return `
  <section class="A${OP ? ' op' + OP : ''}" id="story" style="--n:${steps.length + 1}"><div class="stage" data-s="0">
    ${steps.map(ph).join('')}<div class="shade"></div>
    <div class="bar"><span class="brand" data-wm></span><div class="dots">${steps.map((_, i) => `<i${i ? '' : ' class="on"'}></i>`).join('')}</div>
      <button class="x" id="storyX" type="button" title="ปิดภาพเล่าเรื่อง ไปที่เมนูเลย">${esc(S.close)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="txt">${steps.map(([, , h], i) => `<div class="step${i ? '' : ' on'}">${h}</div>`).join('')}</div>
    ${steps.map(([, c], i) => `<span class="cap${i ? '' : ' on'}">${esc(c)}</span>`).join('')}
    <a class="skip" href="#app">${esc(S.skip)} ${ic('next')}</a>
  </div></section>
  <section class="D" id="app"></section>`;
}, (C, k0) => {
  // ── A: เลื่อนหน้า → เปลี่ยนรูป/ข้อความทีละช่วง
  const A = $('story'), n = A.querySelectorAll('.txt .step').length;
  const L = [A.querySelectorAll('.ph'), A.querySelectorAll('.txt .step'), A.querySelectorAll('.cap'), A.querySelectorAll('.dots i')];
  let cur = 0;
  const onScroll = () => {
    const max = A.offsetHeight - innerHeight, p = Math.min(1, Math.max(0, (scrollY - A.offsetTop) / max));
    const s = Math.min(n - 1, Math.floor(p * n * .999));
    if (s === cur) return; cur = s;
    L.forEach(l => l.forEach((e, i) => e.classList.toggle('on', i === s)));
    A.firstElementChild.dataset.s = s;
  };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  // ปิดช่วงรูป → ไปเมนูทันที · จำไว้ (ครั้งหน้าเปิดมาเจอเมนูเลย) · เปิดกลับได้ที่ปุ่ม "ดูภาพตลาด"
  const STORY = 'adStory';
  let storyOff = false; try { storyOff = localStorage.getItem(STORY) === 'off'; } catch {}
  const setStory = off => {
    storyOff = off; A.hidden = off;
    try { off ? localStorage.setItem(STORY, 'off') : localStorage.removeItem(STORY); } catch {}
    scrollTo({ top: 0, behavior: 'instant' }); render();
  };
  A.hidden = storyOff && !/[?&]op=/.test(location.search);   // ลิงก์ทดลองหน้าเปิด → โชว์ช่วงรูปเสมอ
  $('storyX').onclick = () => setStory(true);

  // ── D: เลือกสาขา + ลูกค้า/ผู้ค้า → ปุ่มใหญ่จากไฟล์เนื้อหาสาขานั้น
  const D = $('app'), S = C.story;
  let k = k0, who = new URLSearchParams(location.search).get('who') === 'ven' ? 'ven' : 'cus', seen = false;
  const pop = () => D.querySelectorAll('.tile').forEach((t, i) => setTimeout(() => t.classList.add('in'), 60 + i * 60));
  const render = () => {
    const b = C[k], list = (who === 'cus' ? b.customer.quick : b.vendor.quick).filter(q => q.title);
    // ป้ายเปิด/ปิด เฉพาะสาขาที่มีเวลาตลาด (โคราชมีแต่เวลาสำนักงาน → ไม่โชว์)
    const mk = b.facts.find(f => f[0] === 'food')?.[2], st = mk && openStatus(mk);
    const min = who === 'ven' && hasVendor(C, k) ? Math.min(...zonesOf(C, k).flatMap(([, Z]) => Z.rows.flatMap(r => nums(r.online)))) : 0;
    const tile = q => { const h = tileHref(C, k, q), big = q.main;
      return `<a class="tile${big ? ' big' : ''}"${h ? ` href="${esc(h)}"${ext(h)}` : ''}>${ic(q.ic)}<b>${phr(q.title)}</b>${q.sub ? `<small>${phr(q.sub)}</small>` : ''}${big && min ? `<span class="p on">เริ่ม ${min} บาท</span>` : ''}</a>`; };
    const more = who === 'cus'
      ? [['branches-b.html?b=' + k, 'pin', 'สาขาและเวลาเปิด'], ['contact-b.html', 'phone', 'ติดต่อตลาด']]
      : [['prices-b.html?b=' + k, 'tag', 'ราคาค่าล็อก'], ['booking-b.html?b=' + k, 'online', 'วิธีจอง'], ['rules-b.html?b=' + k, 'list', 'ระเบียบตลาด']];
    // ปิดภาพเล่าเรื่องแล้ว → หัวหน้าเมนูมีการ์ดลอยแบบหน้าเปิด (เจ้าของ 31 ต.ค. 69) · รูป/ป้าย ตามสาขาที่เลือก
    const pic = photos(C, k)[0]?.[0] || S.img[k] || '', low = hasVendor(C, k) ? Math.min(...zonesOf(C, k).flatMap(([, Z]) => Z.rows.flatMap(r => nums(r.online)))) : 0;
    const hero = A.hidden ? `<div class="hero3">${pic ? `<figure class="card"><img src="${esc(pic)}" alt="${esc(photos(C, k)[0]?.[1] || S.imgNote[k] || b.name)}"></figure>` : `<figure class="card none"><span>รอรูปสาขา</span></figure>`}
      ${mk ? `<span class="chip c1">เปิดทุกวัน <b>${esc(mk)}</b></span>` : ''}${low ? `<span class="chip c2 g">ล็อกเริ่ม <b>${low} บาท/วัน</b></span>` : ''}</div>` : '';
    const menu = `<a class="on" href="#story">${ic('pin')}หน้าแรก</a><a href="branches-b.html?b=${k}">${ic('map')}สาขา</a><a href="prices-b.html?b=${k}">${ic('tag')}ราคา</a><a href="contact-b.html">${ic('phone')}ติดต่อ</a>`;
    D.innerHTML = `<div class="panel">
      <div class="hd">${k === 'korat' ? '<span class="brand mk" role="img" aria-label="Saveone Market ตลาดเซฟวัน"></span>' : '<span class="brand" data-wm></span>'}<nav class="topnav" aria-label="เมนูหลัก">${menu}</nav>${st ? `<span class="open${st.open ? ' on' : ''}"><i></i>${esc(st.text)}</span>` : ''}
        <button class="theme" id="themeBtn" title="สลับธีมสว่าง/มืด" aria-label="สลับธีมสว่าง/มืด">
          <i class="i sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></i>
          <i class="i moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></i></button></div>
      <div class="side">${hero}<h2>${esc(S.appTitle[who])}<br>${esc(S.appAsk)}</h2>
      <div class="seg" role="tablist" aria-label="เลือกสาขา">${C.keys.map(x => `<button data-k="${x}"${x === k ? ' class="on" aria-selected="true"' : ''}>${esc(C[x].name)}</button>`).join('')}</div>
      <div class="who">${['cus', 'ven'].map(w => `<button data-who="${w}"${w === who ? ' class="on" aria-pressed="true"' : ''}>${ic(w === 'cus' ? 'bag' : 'store')}${esc(C.gate[w].title)}</button>`).join('')}</div></div>
      <div class="tiles">${list.map(tile).join('')}</div>
      <div class="more">${more.map(([h, i, t]) => `<a href="${h}">${ic(i)}${t}</a>`).join('')}${storyOff ? `<a href="#" id="storyOn">${ic('next')}${esc(S.reopen)}</a>` : ''}</div></div>
      <nav class="tab" aria-label="เมนูหลัก">${menu}</nav>`;
    D.querySelectorAll('[data-k]').forEach(x => x.onclick = () => { k = x.dataset.k; sync(); });
    D.querySelectorAll('[data-who]').forEach(x => x.onclick = () => { who = x.dataset.who; sync(); });
    $('themeBtn').onclick = toggleTheme;
    if ($('storyOn')) $('storyOn').onclick = e => { e.preventDefault(); setStory(false); };
    fillWordmarks();
    if (seen) pop();
  };
  // จำสาขา/กลุ่มที่เลือกไว้ในลิงก์ (แชร์ต่อได้) โดยไม่เพิ่มประวัติย้อนกลับ
  const sync = () => { const u = new URLSearchParams(location.search); u.set('b', k); u.set('who', who); history.replaceState(null, '', '?' + u + location.hash); render(); };
  render();
  new IntersectionObserver(([e]) => { if (e.isIntersecting && !seen) { seen = true; pop(); } }, { threshold: .2 }).observe(D);
}, { bar: false });
</script>
<script src="b/switch.js?v=20261030b"></script>
</body>
