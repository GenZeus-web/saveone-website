<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ราคาค่าล็อก · ตลาดเซฟวัน โก</title>
<script>{ let t; try { t = localStorage.getItem('theme'); } catch {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b/style.css?v=20261031k">
</head>
<body>
<main id="main"></main>
<script src="content/cms.js?v=20261030a"></script>
<script src="b/parts.js?v=20261031d"></script>
<script src="b/common.js?v=20261031i"></script>
<script>
// ราคาทุกโซนของสาขาที่เลือก (?b=) · ราคาแยกฤดู ฤดูปัจจุบันขึ้นก่อน + ป้าย "ช่วงนี้" · แถววันนี้มีป้าย "วันนี้"
page((C, k) => {
  const b = C[k], V = b.vendor, now = CMS.seasonNow(V.seasons), dow = CMS.dowNow();
  const table = rs => priceTable(rs, V);   // b/parts.js
  const lots = lotExamples;
  const zone = ([z, Z]) => { const R = C.vendor.rules[z] || {};
    // ราคาแยกตามฝั่ง/โซนย่อย (โคราช: Z.spots) → ตารางละตำแหน่ง ไม่รวมเป็นช่วง (เจ้าของ: "แยก อย่ารวมกัน งง")
    const prices = Z.spots ? Z.spots.map(sp => `<div class="spot"><p class="sp">${ic('pin')}<b>${esc(sp.name)}</b>${sp.pending ? `<span class="wait">${esc(sp.pending)}</span>` : ''}${sp.codes ? `<small>${esc(sp.codes)}</small>` : ''}</p>${table(sp.rows)}</div>`).join('')
      : (Z.pending ? `<p class="sp"><span class="wait">${esc(Z.pending)}</span></p>` : '') + table(Z.rows);
    const facts = Z.facts.filter(f => f[0] && filled(f[2]));
    return `<div class="zone z-${z} rv"><div class="zt">${ic(R.ic || Z.ic)} ${esc(Z.name)}${whereBtn(k, z)}</div><div class="zb">
      <div class="zl"><div class="zp">${prices}</div>${lots(z, Z)}</div>
      <div class="za"><p class="rule">${phr(R.sub || '')}</p>
      ${filled(R.ok) ? `<span class="lbl">ขายได้</span><div class="chips">${R.ok.filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
      ${filled(R.no) ? `<span class="lbl">ห้ามขาย</span><div class="chips">${R.no.filter(Boolean).map(t => `<span class="chip no">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="facts">${facts.map(f => `<div class="fact${f[0] === 'size' ? ' wide' : ''}"><small>${esc(f[1])}</small><b>${f[0] === 'online' || f[0] === 'walk' ? dayTag(f[2]) : phr(f[2])}</b></div>`).join('')}</div></div>
      </div></div>`; };
  return `${pageHead(C.gate.ven.title, 'tag', `ราคาค่าล็อก <span class="br">${esc(b.name)}</span>`, phr(V.sub))}
  <section class="sec" style="padding-top:28px"><div class="wrap">
    ${branchTabs(C, k)}
    ${!hasVendor(C, k) ? waitBox(C, k, 'ราคา') : `<div class="zones">${zonesOf(C, k).map(zone).join('')}</div>
    <p class="note">${phr(V.scope)}</p>
    <div class="cta"><a class="btn pri" href="booking-b.html?b=${k}">${ic('online')} วิธีจอง</a><a class="btn alt" href="rules-b.html?b=${k}">${ic('list')} ระเบียบตลาด</a></div>`}
  </div></section>`;
});
</script>
<script src="b/switch.js?v=20261030b"></script>
</body>
</html>
