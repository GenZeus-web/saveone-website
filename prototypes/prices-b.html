<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ราคาค่าล็อก · ตลาดเซฟวัน โก</title>
<script>{ let t; try { t = localStorage.getItem('theme'); } catch {} document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="b/style.css?v=20261031d">
</head>
<body>
<main id="main"></main>
<script src="content/cms.js?v=20261030a"></script>
<script src="b/common.js?v=20261031c"></script>
<script>
// ราคาทุกโซนของสาขาที่เลือก (?b=) · ราคาแยกฤดู ฤดูปัจจุบันขึ้นก่อน + ป้าย "ช่วงนี้" · แถววันนี้มีป้าย "วันนี้"
page((C, k) => {
  const b = C[k], V = b.vendor, now = CMS.seasonNow(V.seasons), dow = CMS.dowNow();
  // ตารางราคามีเส้นชัด (เจ้าของ 31 ต.ค. 69: "ไม่มี solid ตาราง ดูยาก") · คอลัมน์ วัน | จองออนไลน์ | Walk-in · แถวฤดู · แถววันนี้เน้นสี
  const isToday = (s, r) => (!s || s === now) && r.dow === dow;
  const table = (rs, cap = '') => {
    const ss = [...new Set(rs.map(r => r.season))].sort((x, y) => (y === now) - (x === now));   // '' = ราคาเดียวทั้งปี · ฤดูปัจจุบันขึ้นก่อน
    const walk = rs.some(r => r.walkin && r.online), cols = walk ? 3 : 2;
    const body = ss.map(s => { const dim = s && s !== now ? ' dim' : '';
      const head = s ? `<tr class="sh${dim}"><th colspan="${cols}" scope="colgroup">${SEASON[s] ? SEASON[s] + ' · ' : ''}${esc(get(V.seasons, s + '.label') || s)}${s === now ? '<span class="tag">ช่วงนี้</span>' : ''}</th></tr>` : '';
      return head + rs.filter(r => r.season === s && r.online).map(r => `<tr class="${isToday(s, r) ? 'td' : ''}${dim}">
        <th scope="row">${esc(r.days)}${isToday(s, r) ? '<span class="tag">วันนี้</span>' : ''}</th>
        <td class="on">${esc(r.online)}</td>${walk ? `<td class="wk">${esc(r.walkin || '–')}</td>` : ''}</tr>`).join(''); }).join('');
    return `<table class="ptbl">${cap ? `<caption>${cap}</caption>` : ''}<thead><tr><th scope="col">วัน</th><th scope="col">จองออนไลน์<small>บาท/ล็อก/วัน</small></th>${walk ? '<th scope="col">Walk-in<small>บาท/ล็อก/วัน</small></th>' : ''}</tr></thead><tbody>${body}</tbody></table>`;
  };
  // ตัวอย่างล็อก = ภาพเรนเดอร์จากโปรเจกต์ 3D ตลาด (blender/lot-guide.py) · ความกว้างคำนวณจากขนาดล็อกของสาขานั้น
  const LOTS = { food: [['img/lots/food.jpg', [1, 2, 3], '1fr 1fr 1fr']], boot: [['img/lots/boot-12.jpg', [1, 2], '4fr 6fr'], ['img/lots/boot-34.jpg', [3, 4], '1fr 1fr']] };
  const lots = (z, Z) => { const set = LOTS[z === 'court' ? 'food' : z]; if (!set) return '';
    const w = parseFloat(Z.facts.find(f => f[0] === 'size')?.[2]?.match(/[\d.]+/)?.[0] || '');
    return `<div class="lots"><span class="lbl">ตัวอย่างการจอง</span>${set.map(([src, ns, cols]) => `<figure><img src="${src}" alt="ตัวอย่างจอง ${ns.join(' และ ')} ล็อก" loading="lazy">
      <figcaption style="grid-template-columns:${cols}">${ns.map(n => `<span><b>${n} ล็อก</b>${w ? `กว้าง ${+(w * n).toFixed(2)} ม.` : ''}</span>`).join('')}</figcaption></figure>`).join('')}
      <p class="lnote">ภาพประกอบ · ขนาดจริงดูที่ "ขนาดล็อก"</p></div>`; };
  const zone = ([z, Z]) => { const R = C.vendor.rules[z] || {};
    // ราคาแยกตามฝั่ง/โซนย่อย (โคราช: Z.spots) → ตารางละตำแหน่ง ไม่รวมเป็นช่วง (เจ้าของ: "แยก อย่ารวมกัน งง")
    const prices = Z.spots ? Z.spots.map(sp => `<div class="spot"><p class="sp">${ic('pin')}<b>${esc(sp.name)}</b>${sp.pending ? `<span class="wait">${esc(sp.pending)}</span>` : ''}${sp.codes ? `<small>${esc(sp.codes)}</small>` : ''}</p>${table(sp.rows)}</div>`).join('')
      : (Z.pending ? `<p class="sp"><span class="wait">${esc(Z.pending)}</span></p>` : '') + table(Z.rows);
    const facts = Z.facts.filter(f => f[0] && filled(f[2]));
    return `<div class="zone z-${z} rv"><div class="zt">${ic(R.ic || Z.ic)} ${esc(Z.name)}</div><div class="zb">
      <div class="zl"><div class="zp">${prices}</div>${lots(z, Z)}</div>
      <div class="za"><p class="rule">${phr(R.sub || '')}</p>
      ${filled(R.ok) ? `<span class="lbl">ขายได้</span><div class="chips">${R.ok.filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
      ${filled(R.no) ? `<span class="lbl">ห้ามขาย</span><div class="chips">${R.no.filter(Boolean).map(t => `<span class="chip no">${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="facts">${facts.map(f => `<div class="fact${f[0] === 'size' ? ' wide' : ''}"><small>${esc(f[1])}</small><b>${f[0] === 'online' || f[0] === 'walk' ? dayTag(f[2]) : phr(f[2])}</b></div>`).join('')}</div></div>
      </div></div>`; };
  return `${pageHead(C.gate.ven.title, 'tag', `ราคาค่าล็อก <span class="br">${esc(b.name)}</span>`, phr(V.sub))}
  <section class="sec" style="padding-top:28px"><div class="wrap">
    ${branchTabs(C, k)}
    ${!hasVendor(C, k) ? waitBox(C, k, 'ราคา') : `<div class="zones">${zonesOf(C, k).map(zone).join('')}</div>
    <p class="note">${phr(V.scope)}</p>
    <div class="cta"><a class="btn pri" href="booking-b.html?b=${k}">${ic('online')} วิธีจอง</a><a class="btn alt" href="rules-b.html?b=${k}">${ic('list')} ระเบียบตลาด</a></div>`}
  </div></section>`;
});
</script>
<script src="b/switch.js?v=20261030b"></script>
</body>
</html>
